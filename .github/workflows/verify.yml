# The plugin's own checks.
#
# `npm ci` cannot work in this repository: `package.json` depends on a `file:../mcp` sibling
# that exists in the source repository and not here, so resolving the tree fails before it
# starts. Almost nothing under test needs a dependency — every hook, library and script imports
# node builtins and local files only — with one exception: `test/engine-floor.test.mjs` imports
# esbuild, because the guarantee it checks is "the shipped bundle parses on the oldest Node we
# claim to support", and the honest way to check that is to hand the file to the same parser the
# build uses. So the step below installs that one package, out-of-tree, at the version the
# lockfile pins.
#
# The bundles under `hooks/dist`, `mcp/dist` and `bin/` are committed artifacts: Claude Code
# installs a plugin by fetching the repository, so whatever is committed is what runs. The last
# step rebuilds every target except the vendored server — which does need the private sibling —
# and fails if the result differs from what is committed. That is the invariant that keeps a
# comment edited in `hooks/src` from living on inside a stale bundle's sourcemap.

name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: integrations/claude-code

jobs:
  test:
    name: tests and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Installed in a scratch package and copied in, rather than `npm install esbuild` here:
      # any npm command run in this directory resolves the whole manifest first and dies on the
      # missing sibling. Version pinned to package-lock.json so CI parses with what the build uses.
      - name: provide the build parser (esbuild only)
        working-directory: /tmp
        run: |
          mkdir -p ebuild && cd ebuild
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --no-save esbuild@0.28.2
          mkdir -p "$GITHUB_WORKSPACE/integrations/claude-code/node_modules"
          cp -R node_modules/. "$GITHUB_WORKSPACE/integrations/claude-code/node_modules/"

      - name: syntax
        run: node --check hooks/src/*.mjs lib/*.mjs bin/*.mjs mcp/src/*.mjs

      # Against the sources.
      - name: test
        run: node --test 'test/**/*.test.mjs'

      # Against the committed bundles — the code that actually ships.
      - name: test (dist)
        run: MUBIT_CC_TEST_TARGET=dist node --test 'test/**/*.test.mjs'

      - name: manifests
        run: node scripts/verify-manifests.mjs

      # Everything except the vendored server, which is built from a package that is not here.
      - name: committed bundles match their source
        run: |
          MUBIT_CC_BUILD_SKIP_SERVER=1 node esbuild.config.mjs
          git diff --exit-code -- hooks/dist mcp/dist/index.js bin \
            || { echo "::error::the committed bundles are stale — run the build and commit the result"; exit 1; }
