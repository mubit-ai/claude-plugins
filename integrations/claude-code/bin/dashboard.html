  /** Point the page at a family. Memory is not refetched: the view is a filter over one load. */
  function adoptFamily(fam, runId) {
    state.family = {
      key: fam.key,
      ids: fam.runs.map((r) => r.runId),
      bases: fam.bases.slice(),
      projectDir: fam.projectDir,
      current: fam.current,
    };
    if (runId) state.run = runId;
    else if (state.family.ids.indexOf(state.run) < 0) state.run = fam.current;
  }

  function selectFamily(fam, runId) {
    adoptFamily(fam, runId || fam.current);
    state.selectedEntry = null;
    state.selectedTurn = null;
    state.selectedTurnDetail = null;
    state.searchResults = null;
    state.railOpen = false;
    syncRail();
    renderRail();
    renderIdentity();
    renderMemory();
    renderTurnDetail(null);
    refreshLocal();
    refreshAnalytics();
  }

  // -------------------------------------------------------------------------
  // Identity strip
  // -------------------------------------------------------------------------

  function dirNameOf(path) {
    const dirs = (state.meta && state.meta.dirs) || [];
    const hit = dirs.find((d) => d.path === path);
    return hit ? hit.name : pathParts(path).tail;
  }

  function renderIdentity() {
    const now = Date.now();
    const fam = currentFamily();
    const id = runIdentity(currentRunRow(), state.meta, state.runs);
    const meta = state.meta || {};
    const scope = meta.scope || {};
    const famSessions = fam
      ? fam.runs.reduce((acc, r) => acc.concat(Array.isArray(r.sessions) ? r.sessions : []), [])
        .sort((a, b) => (Number(b.lastSeenAt) || 0) - (Number(a.lastSeenAt) || 0))
      : id.sessions;
    const newest = famSessions[0] || null;

    // The parts that tick: cheap text nodes, rewritten every poll.
    const st = $('id-run-state');
    clear(st);
    if (id.runId) {
      st.appendChild(el('span', 'state-dot ' + runStateTone(id.state)));
      st.appendChild(document.createTextNode(
        id.state + (id.mode ? ' · ' + id.mode : '') + ' · updated ' + relativeTime(id.lastWrite, now)));
    }
    $('id-sessions').textContent = !id.runId ? '—' : famSessions.length
      ? (famSessions.length + (famSessions.length === 1 ? ' session' : ' sessions') + ' in this directory'
        + ' · newest ' + shortSession(newest.sessionId) + ' (' + (newest.agentId || 'agent unknown') + ') seen '
        + relativeTime(newest.lastSeenAt, now)
        + ' · ' + strategyLabel((newest && newest.strategy) || scope.strategy))
      : 'No session record maps to this directory yet · ' + strategyLabel(scope.strategy);

    // The parts that do not: rewritten only when something in them changed, so the session
    // list stays open and the toggle keeps focus across the one-second poll.
    const famSig = fam ? fam.key + ':' + fam.runs.map((r) => r.runId + '=' + r.label).join(',') : '';
    const sig = identitySignature(id) + '|' + famSig + '|' + (meta.dir || '') + '|' + JSON.stringify(scope);
    if (sig === state.identitySig) return;
    state.identitySig = sig;

    const projectDir = (fam && fam.projectDir) || id.projectDir;
    const projectRoot = (fam && fam.projectRoot) || id.projectRoot;
    $('id-path').textContent = projectDir || (id.runId ? 'no directory recorded for this run' : '—');
    $('id-root').textContent = projectRoot && projectRoot !== projectDir ? 'git root ' + projectRoot : '';
    $('id-datadir').textContent = meta.dir ? 'data directory ' + dirNameOf(meta.dir) : '';

    $('id-run').textContent = id.runId || '—';
    const member = fam ? fam.runs.find((r) => r.runId === id.runId) : null;
    const notes = [];
    if (member) notes.push(member.label);
    if (fam && fam.runs.length > 1) notes.push(fam.runs.length + ' runs in this directory');
    if (id.isLaunchRun) notes.push('this dashboard was launched here');
    $('id-run-note').textContent = notes.join(' · ');

    const list = $('id-session-list');
    const box = list.querySelector('.sessions');
    clear(box);
    const clearTotal = famSessions.reduce((a, s) => a + (Number(s && s.clearCount) || 0), 0);
    list.querySelector('summary').textContent = famSessions.length
      ? 'every session (' + famSessions.length + (clearTotal ? ', cleared ' + clearTotal + '× in total' : '') + ')'
      : 'no sessions';
    famSessions.forEach((s) => {
      const row = el('div', 'session', sessionLabel(s, now) + (s.runId && s.runId !== id.runId ? ' · run ' + s.runId : ''));
      row.title = s.sessionId + (s.projectDir ? ' · ' + s.projectDir : '');
      box.appendChild(row);
    });

    const sc = $('id-scope');
    clear(sc);
    const sentences = scopeSentences(scope);
    sc.appendChild(el('p', null, sentences.writes));
    sc.appendChild(el('p', null, sentences.reads));
  }

  function syncRail() {
    $('body').classList.toggle('rail-open', state.railOpen);
    $('rail-toggle').setAttribute('aria-expanded', String(state.railOpen));
    $('rail-toggle').textContent = state.railOpen ? 'Hide directories' : 'Change directory';
  }
  $('rail-toggle').addEventListener('click', () => { state.railOpen = !state.railOpen; syncRail(); });

  // -------------------------------------------------------------------------
  // Rail
  // -------------------------------------------------------------------------

  function renderDirs(dirs) {
    const sel = $('dirs');
    if (sel.dataset.count === String(dirs.length) && sel.value === state.dir) return;
    sel.dataset.count = String(dirs.length);
    clear(sel);
    dirs.forEach((d) => {
      const o = el('option', null, d.name + '  (' + d.runCount + ' runs)');
      o.value = d.path;
      sel.appendChild(o);
    });
    sel.value = state.dir;
  }

  function runMeta(r, now) {
    return r.label + ' · ' + r.turnCount + (r.turnCount === 1 ? ' turn' : ' turns') + ' · '
      + relativeTime(r.lastWrite, now);
  }

  function familyMeta(f, now) {
    const runs = f.runs.filter((r) => r.label !== 'subagent').length;
    return runs + (runs === 1 ? ' run' : ' runs') + ' · ' + f.turnCount + (f.turnCount === 1 ? ' turn' : ' turns')
      + (f.agentIds.length ? ' · ' + f.agentIds.join(', ') : '') + ' · ' + relativeTime(f.lastWrite, now);
  }

  /**
   * One entry per directory, its runs under it. Rebuilt only when the set of families or
   * their labels change; otherwise the rows are patched in place, so the one-second poll does
   * not rebuild the list under a focused button.
   */
  function renderRail() {
    const now = Date.now();
    const box = $('runs');
    const fams = state.families;
    const sig = fams.map((f) => f.key + ':' + f.runs.map((r) => r.runId + '=' + r.label).join(',')).join('|');

    if (sig === state.railSig && box.children.length === fams.length && fams.length) {
      fams.forEach((f, i) => {
        const node = box.children[i];
        const head = node.querySelector('.dirhead');
        head.setAttribute('aria-current', String(f.key === state.family.key));
        head.querySelector('.meta').textContent = familyMeta(f, now);
        const rows = node.querySelectorAll('.run');
        f.runs.filter((r) => r.label !== 'subagent').forEach((r, j) => {
          const b = rows[j];
          if (!b) return;
          b.setAttribute('aria-current', String(r.runId === state.run));
          b.querySelector('.state-dot').className = 'state-dot ' + runStateTone(r.state);
          b.querySelector('.txt').textContent = runMeta(r, now);
        });
      });
      return;
    }
    state.railSig = sig;
    clear(box);
    if (!fams.length) {
      box.appendChild(el('p', 'empty', 'No runs in this data directory yet.'));
      return;
    }
    fams.forEach((f) => {
      const node = el('div', 'dir');
      const head = el('button', 'dirhead');
      head.setAttribute('aria-current', String(f.key === state.family.key));
      head.appendChild(el('div', 'path', f.projectDir || f.bases[0]));
      head.title = f.projectDir ? f.projectDir : 'no session record names a directory; shown by run id';
      head.appendChild(el('div', 'meta', familyMeta(f, now)));
      head.addEventListener('click', () => selectFamily(f));
      node.appendChild(head);
      f.runs.filter((r) => r.label !== 'subagent').forEach((r) => {
        const b = el('button', 'run');
        b.setAttribute('aria-current', String(r.runId === state.run));
        b.appendChild(el('div', 'id', r.runId));
        const meta = el('div', 'meta');
        meta.appendChild(el('span', 'state-dot ' + runStateTone(r.state)));
        meta.appendChild(el('span', 'txt', runMeta(r, now)));
        b.appendChild(meta);
        b.title = 'Make ' + r.runId + ' the run that writes, searches and health name. Turns and analytics still show the whole directory.';
        b.addEventListener('click', () => selectFamily(f, r.runId));
        node.appendChild(b);
      });
      if (f.subagentRuns) {
        node.appendChild(el('div', 'subs', f.subagentRuns + (f.subagentRuns === 1 ? ' subagent run' : ' subagent runs')));
      }
      box.appendChild(node);
    });
  }

  // -------------------------------------------------------------------------
  // Memory tab
  // -------------------------------------------------------------------------

  function currentEntries() {
    if (state.searchResults) return state.searchResults;
    return state.mode === 'lessons' ? state.lessons : state.activity;
  }

  /**
   * Whether the scope and project facets can say anything true about what is loaded.
   *
   * The activity feed is fetched with the compact projection, and compact is not a subset —
   * the server *overwrites* `metadata_json` with `{entry_type, created_at}`, so scope is not
   * merely missing from those rows, it has been discarded upstream. Asking for a full
   * projection over a feed that is overwhelmingly traces would pull megabytes to answer a
   * question about lessons. So in activity mode the facets are switched off and say why.
   */
  function facetsApply() {
    return state.mode === 'lessons' || !!state.searchResults;
  }

  const activeScope = () => (facetsApply() ? state.scope : '');
  const activeProject = () => (facetsApply() ? state.project : '');

  /**
   * Once a search has run, the text box holds the *query*, not a filter.
   *
   * The instance answers semantically: "how do we publish the mirror" can return a lesson that
   * contains none of those words, which is the entire reason for asking it rather than grepping
   * what is loaded. Re-applying the same string as a literal substring filter over the answer
   * threw those rows away again — a search that worked, rendering as a search that found
   * nothing. Escape clears the results and hands the box back to the instant filter.
   */
  const activeText = () => (state.searchResults ? '' : $('filter').value.trim().toLowerCase());

  /** Search results are the instance's answer, not this directory's: the view does not apply. */
  const activeView = () => (state.searchResults ? 'all' : state.view);

  function filteredEntries() {
    const q = activeText();
    const scope = activeScope();
    const project = activeProject();
    const view = activeView();
    const bases = state.family.bases;
    return currentEntries().filter((e) => matchesView(e, view, bases) && matchesScope(e, scope)
      && matchesProject(e, project) && matchesType(e, state.type) && matchesText(e, q));
  }

  /** What the scope filter alone costs, so the footer can offer to give it back. */
  function hiddenByScope() {
    const scope = activeScope();
    if (!scope) return 0;
    const q = activeText();
    const project = activeProject();
    const view = activeView();
    const bases = state.family.bases;
    return currentEntries().filter((e) => matchesView(e, view, bases) && matchesProject(e, project)
      && matchesType(e, state.type) && matchesText(e, q) && !matchesScope(e, scope)).length;
  }

  const FACET_OFF = 'The activity feed is fetched with the compact projection, which the instance '
    + 'returns with the scope metadata stripped out — so no scope or project filter can say '
    + 'anything true about these rows. Switch to Lessons to filter by scope.';

  const PROJECT_NOTE = 'Only the hook capture paths write a project tag. A lesson saved through the '
    + 'mubit_learned tool, or written by reflection, carries none — so "no project tag" means '
    + 'unattributed, never that this entry belongs to the project you are in.';

  const LEAK_NOTE = 'Above run scope, so visible to runs other than the one that wrote it. By design '
    + 'for a rule meant to follow you; a surprise for anything that was only ever about one project.';

  /** The three view buttons carry the counts of the list under them. */
  function renderViewCounts() {
    const c = placementCounts(currentEntries(), state.family.bases);
    const put = (node, n) => { const b = node.querySelector('b'); if (b) b.textContent = String(n); };
    put($('runs-this'), c.here);
    put($('runs-reach'), c.reach);
    put($('runs-all'), c.all);
  }

  /** The loaded window, counted by scope. A chip is the scope filter with a number on it. */
  function renderScopeChips() {
    const box = $('scope-summary');
    clear(box);
    const rows = currentEntries();
    if (!rows.length) return;
    const on = facetsApply();
    const c = scopeCounts(rows);
    box.appendChild(el('span', 'eyebrow lbl', 'scope'));
    [['run', 'run'], ['session', 'session'], ['global', 'global'], ['org', 'org'], ['unknown', 'not recorded']]
      .forEach((pair) => {
        if (!c[pair[0]] && pair[0] === 'org') return;
        const chip = el('button', 'chip', pair[1]);
        chip.appendChild(el('b', null, c[pair[0]]));
        chip.setAttribute('aria-pressed', String(on && state.scope === pair[0]));
        chip.disabled = !on;
        chip.title = on ? 'Show only ' + pair[1] + ' scope' : FACET_OFF;
        chip.addEventListener('click', () => {
          state.scope = state.scope === pair[0] ? '' : pair[0];
          $('scope-filter').value = state.scope;
          renderMemory();
        });
        box.appendChild(chip);
      });
  }

  function renderTypeChips() {
    const box = $('type-summary');
    clear(box);
    const counts = typeCounts(currentEntries());
    if (state.type && !counts.some((t) => t.key === state.type)) state.type = '';
    if (counts.length < 2 && !state.type) return;
    box.appendChild(el('span', 'eyebrow lbl', 'type'));
    counts.forEach((t) => {
      const chip = el('button', 'chip', t.key);
      chip.appendChild(el('b', null, t.count));
      chip.setAttribute('aria-pressed', String(state.type === t.key));
      chip.title = 'Show only ' + t.key + ' entries';
      chip.addEventListener('click', () => {
        state.type = state.type === t.key ? '' : t.key;
        renderMemory();
      });
      box.appendChild(chip);
    });
  }

  function renderMemoryList() {
    const box = $('memory-list');
    clear(box);

    const rows = filteredEntries();
    const err = state.mode === 'lessons' ? state.lessonsError : state.activityError;
    if (err || !rows.length) {
      const msg = listEmptyMessage({
        mode: state.mode, error: err, loaded: state.loaded,
        total: currentEntries().length, view: activeView(),
      });
      box.appendChild(el('p', 'empty', msg.text));
      if (msg.detail) box.appendChild(el('p', 'note', msg.detail));
      return;
    }

    const now = Date.now();
    let undated = 0;
    groupByDay(rows, now, state.sort).forEach((g) => {
      box.appendChild(el('div', 'dayhead', g.key + ' (' + g.rows.length + ')'));
      if (g.key === 'Undated') undated = g.rows.length;
      g.rows.forEach((e) => box.appendChild(memoryRow(e)));
    });
    if (undated && undated === rows.length) {
      box.appendChild(el('p', 'note', state.searchResults
        ? 'Search evidence carries no timestamp of its own; a result that is also in the loaded '
          + 'window borrows its date from there.'
        : 'None of these rows carries a creation time, so they cannot be placed in order.'));
    }
  }

  /** The directory a foreign row came from, by name; its run id when no directory is known. */
  function fromText(e) {
    const fam = familyOfRow(e, state.families);
    if (fam && fam.projectDir) return pathParts(fam.projectDir).tail;
    const run = plainRunId(rowRunId(e));
    return run ? shortId(run, 24) : 'unknown';
  }

  /** Time first, scope first among the badges, then the content, then where it came from. */
  function memoryRow(e) {
    const b = el('button', 'item');
    b.setAttribute('aria-current', String(state.selectedEntry && state.selectedEntry.id === e.id));

    const iso = isoOf(e);
    const t = el('div', 't', clockOf(iso));
    t.title = iso || 'no creation time recorded';
    b.appendChild(t);

    const main = el('div', 'main');
    const badges = el('div', 'badges');
    badges.appendChild(scopeBadge(e));
    const type = typeOf(e);
    if (type !== 'entry') badges.appendChild(tag(type, 'type'));
    if (e.importance) badges.appendChild(tag(e.importance));
    main.appendChild(badges);
    main.appendChild(el('div', 'c', e.content || '(no content)'));

    const m = el('div', 'm');
    const origin = originOf(e);
    if (origin) {
      const o = el('span', null, ORIGIN_WORD[origin] || origin + (e.tool ? ' (' + e.tool + ')' : ''));
      if (origin === 'hook' && e.tool) o.textContent = 'hook capture (' + e.tool + ')';
      m.appendChild(o);
    }
    const lines = provenanceLines(e, { families: state.families, turns: state.turns });
    const session = lines.find((l) => l.key === 'session');
    if (session && session.sessionId) {
      const s = el('span', session.how === 'by time' ? 'sub' : null, 'session ' + shortSession(session.sessionId));
      s.title = session.sessionId + (session.how === 'by time' ? ' — inferred from the time, not recorded on the write' : '');
      m.appendChild(s);
    }
    const prompt = lines.find((l) => l.key === 'prompt');
    if (prompt && prompt.turn) {
      const p = el('span', 'prompt' + (prompt.how === 'by time' ? ' sub' : ''),
        '↳ “' + promptWords(prompt.turn.promptPreview || prompt.turn.prompt) + '”');
      p.title = (prompt.turn.promptPreview || '') + (prompt.how === 'by time' ? ' — inferred from the time' : '');
      m.appendChild(p);
    }
    const where = placement(e, state.family.bases);
    if (where !== 'here') {
      const f = el('span', where === 'shared' ? 'from' : null, 'from ' + fromText(e));
      f.title = where === 'shared'
        ? 'Saved by another directory at a scope that reaches here at recall.'
        : 'Saved by another directory, at run scope: it does not reach here.';
      m.appendChild(f);
    }
    if (e.agentType) m.appendChild(tag('subagent ' + e.agentType, 'sub'));
    if (e.project) m.appendChild(el('span', null, e.project));
    main.appendChild(m);
    b.appendChild(main);

    b.addEventListener('click', () => {
      state.selectedEntry = e;
      renderMemory();
      // Below the split's breakpoint the detail stacks under the list, out of view.
      if (narrow('(max-width: 60rem)')) $('memory-detail').scrollIntoView({ block: 'nearest' });
    });
    return b;
  }

  /**
   * Always rendered, never gated on the row carrying a scope. Gating it was how a search
   * result and an untagged lesson both came back with no badge at all, which reads as "no
   * scope" — a thing the vocabulary does not contain.
   */
  function scopeBadge(e) {
    const known = scopeKnown(e);
    const t = tag(known ? scopeOf(e) : 'scope ?', scopeTone(e));
    t.title = known
      ? reachSentence(e)
      : 'Nothing recorded a scope for this entry. The instance defaults an untagged '
        + 'lesson to run scope, so that is how it behaves — but "defaulted" and "recorded" are '
        + 'different facts, and only this badge can tell you which one you are looking at.';
    return t;
  }

  function copyButton(text) {
    const b = el('button', 'btn small', 'Copy');
    b.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(text);
        b.textContent = 'copied';
      } catch (err) {
        b.textContent = 'select it';
      }
      setTimeout(() => { b.textContent = 'Copy'; }, 1400);
    });
    return b;
  }

  /**
   * Resolve one entry by id through /api/entry, once. A compact activity row and an injected
   * memory id both carry less than the instance knows; this is where the rest comes from.
   */
  function loadEntry(id) {
    const key = String(id || '');
    if (!key) return Promise.reject(new Error('no id'));
    if (state.entryCache.has(key)) return Promise.resolve(state.entryCache.get(key));
    if (state.entryInflight.has(key)) return state.entryInflight.get(key);
    const p = api('/api/entry?dir=' + enc(state.dir) + '&run=' + enc(state.run) + '&id=' + enc(key))
      .then((body) => {
        const entry = body && body.entry ? body.entry : null;
        state.entryCache.set(key, entry);
        return entry;
      })
      .finally(() => { state.entryInflight.delete(key); });
    state.entryInflight.set(key, p);
    return p;
  }

  /** The selected entry with everything the instance knows about it merged in, once fetched. */
  function resolvedEntry(e) {
    const hit = e && e.id ? state.entryCache.get(String(e.id)) : null;
    return hit ? Object.assign({}, e, hit, { scope: e.scope !== undefined ? e.scope : hit.scope, scopeKnown: e.scopeKnown !== undefined ? e.scopeKnown : hit.scopeKnown }) : e;
  }

  function renderMemoryDetail() {
    const box = $('memory-detail');
    clear(box);
    const selected = state.selectedEntry;
    if (!selected) {
      box.appendChild(el('p', 'empty', 'Select an entry.'));
      return;
    }
    const e = resolvedEntry(selected);

    // A compact row says little; the instance says the rest. Fetch once, then re-render.
    if (selected.id && !state.entryCache.has(String(selected.id)) && (state.mode !== 'lessons' || !selected.lessonType)) {
      loadEntry(selected.id).then(() => {
        if (state.selectedEntry === selected) renderMemoryDetail();
      }).catch(() => { state.entryCache.set(String(selected.id), null); });
    }

    box.appendChild(el('h2', null, typeOf(e)));
    const prov = el('div', 'prov');
    provenanceLines(e, { families: state.families, turns: state.turns }).forEach((line) => {
      const div = el('div', null, line.text);
      if (line.key === 'saved' && line.iso) div.title = line.iso;
      if (line.key === 'reach' && leaksScope(e)) div.title = LEAK_NOTE;
      if (line.key === 'prompt' && line.turn) {
        const link = el('button', 'btn link', 'Show turn');
        link.setAttribute('aria-label', 'Show this prompt on the Turns tab');
        link.addEventListener('click', () => showTurn(line.turn));
        div.appendChild(link);
      }
      prov.appendChild(div);
    });
    box.appendChild(prov);

    const dl = el('dl');
    const pair = (k, v) => {
      dl.appendChild(el('dt', null, k));
      const dd = el('dd', null, v);
      dl.appendChild(dd);
      return dd;
    };
    if (e.importance) pair('importance', e.importance);
    const proj = pair('project', e.project || 'no project tag');
    if (!e.project) proj.title = PROJECT_NOTE;
    pair('scope', scopeKnown(e) ? scopeOf(e) : scopeOf(e) + ' (not recorded)');
    const idRow = pair('id', e.id || '—');
    if (e.id) idRow.appendChild(copyButton(e.id));
    box.appendChild(dl);

    box.appendChild(el('p', 'prose', e.content || ''));
    if (e.rationale) {
      box.appendChild(el('div', 'eyebrow', 'Rationale'));
      box.appendChild(el('p', 'prose', e.rationale));
    }
    if (e.conditions && e.conditions.length) {
      box.appendChild(el('div', 'eyebrow', 'Conditions'));
      box.appendChild(el('p', 'prose', e.conditions.join(', ')));
    }

    if (state.mode !== 'lessons' || !e.id) return;

    const actions = el('div', 'row');
    actions.appendChild(actionButton('Worked', () => outcome(e, true)));
    actions.appendChild(actionButton('Did not work', () => outcome(e, false)));
    actions.appendChild(actionButton('Archive', () => archive(e)));
    box.appendChild(actions);

    box.appendChild(deleteConfirm(e));
  }

  function actionButton(label, fn) {
    const b = el('button', 'btn', label);
    b.addEventListener('click', async () => {
      b.disabled = true;
      const original = b.textContent;
      try {
        await fn();
        b.textContent = 'done';
      } catch (err) {
        showBanner(err.code, err.message);
        b.textContent = 'failed';
      }
      setTimeout(() => { b.textContent = original; b.disabled = false; }, 1400);
    });
    return b;
  }

  /**
   * Deletion has no undo, so the gesture is typing the id rather than clicking twice. The
   * server enforces the same match independently — a confirmation that lives only here is one
   * that a replayed request skips.
   */
  function deleteConfirm(e) {
    const box = el('div', 'confirm');
    box.appendChild(el('div', 'eyebrow', 'Delete permanently'));
    box.appendChild(el('p', 'note',
      'There is no undo and no dry run. For a lesson that is merely wrong rather than unwanted, '
      + '"Did not work" above down-weights it instead. To delete, type the id exactly.'));

    const input = el('input');
    input.type = 'text';
    input.placeholder = e.id;
    input.setAttribute('aria-label', 'Type the lesson id to confirm deletion');

    const row = el('div', 'row');
    const btn = el('button', 'btn danger', 'Delete');
    btn.disabled = true;
    input.addEventListener('input', () => { btn.disabled = input.value.trim() !== e.id; });
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await post('/api/forget', { lessonId: e.id, confirm: input.value.trim() });
        state.lessons = state.lessons.filter((l) => l.id !== e.id);
        state.selectedEntry = null;
        renderMemory();
      } catch (err) {
        showBanner(err.code, err.message);
        btn.disabled = false;
      }
    });

    row.appendChild(input);
    row.appendChild(btn);
    box.appendChild(row);
    return box;
  }

  function outcome(e, success) {
    return post('/api/outcome', {
      run: state.run,
      referenceId: e.id,
      success: success,
      entryIds: [e.id],
    });
  }

  function archive(e) {
    return post('/api/archive', {
      run: state.run,
      content: e.content,
      artifactKind: 'note',
      metadataJson: JSON.stringify({ archived_from: e.id, via: 'dashboard' }),
    });
  }

  /**
   * `org` is offered only once something carries it, so the select cannot advertise a filter
   * that is guaranteed to match nothing on an instance that has never promoted a lesson.
   */
  function syncScopeVocabulary() {
    const opt = $('scope-filter').querySelector('option[value="org"]');
    if (!opt) return;
    const present = currentEntries().some((e) => scopeOf(e) === 'org');
    if (present) { opt.removeAttribute('hidden'); opt.removeAttribute('disabled'); return; }
    opt.setAttribute('hidden', '');
    opt.setAttribute('disabled', '');
    if (state.scope === 'org') state.scope = '';
  }

  function renderProjectFacet() {
    const sel = $('project-filter');
    const counts = new Map();
    currentEntries().forEach((e) => {
      const p = projectOf(e);
      counts.set(p, (counts.get(p) || 0) + 1);
    });
    const slugs = Array.from(counts.keys()).filter((p) => p !== NO_PROJECT).sort();
    if (counts.has(NO_PROJECT)) slugs.push(NO_PROJECT);

    clear(sel);
    const every = el('option', null, 'Every project');
    every.value = '';
    sel.appendChild(every);
    slugs.forEach((p) => {
      const o = el('option', null, (p === NO_PROJECT ? 'No project tag (unattributed)' : p)
        + '  (' + counts.get(p) + ')');
      if (p === NO_PROJECT) o.title = PROJECT_NOTE;
      o.value = p;
      sel.appendChild(o);
    });
    // A facet value that has fallen out of the loaded window would otherwise leave the select
    // showing "Every project" while still filtering by the vanished one.
    if (state.project && !counts.has(state.project)) state.project = '';
    sel.value = state.project;
  }

  function syncFacetAvailability() {
    const on = facetsApply();
    ['scope-filter', 'project-filter'].forEach((id) => {
      const sel = $(id);
      sel.disabled = !on;
      sel.title = on ? '' : FACET_OFF;
    });
  }

  /**
   * The line that makes a filter matching nothing legible.
   *
   * Everything above this is a view over the loaded window; the census numbers are the
   * server's count over the whole instance before paging. Without them, "0 shown" and "your
   * instance is empty" are the same pixels.
   */
  function renderMemoryFooter() {
    const foot = $('memory-footer');
    clear(foot);

    const hidden = hiddenByScope();
    const parts = footerParts({
      shown: filteredEntries().length,
      hidden: hidden,
      mode: state.mode,
      census: state.searchResults ? null : state.census,
      search: !!state.searchResults,
      searchQuery: state.searchQuery,
    });
    foot.appendChild(document.createTextNode(parts.join(' · ')));

    if (hidden) {
      const b = el('button', 'btn link', 'Show every scope');
      b.setAttribute('aria-label', 'Clear the scope filter and show every scope');
      b.addEventListener('click', () => {
        state.scope = '';
        $('scope-filter').value = '';
        renderMemory();
      });
      foot.appendChild(document.createTextNode(' · '));
      foot.appendChild(b);
    }

    $('memory-scope-note').textContent = state.searchResults
      ? 'Search results are the instance’s answer over every run; the view does not apply to them.'
      : scopeNoteText({ mode: state.mode, view: state.view, joinError: state.joinError });
  }

  function renderMemory() {
    syncScopeVocabulary();
    syncFacetAvailability();
    renderProjectFacet();
    renderViewCounts();
    renderScopeChips();
    renderTypeChips();
    renderMemoryList();
    renderMemoryDetail();
    renderMemoryFooter();
  }

  /** Select an entry on the Memory tab, from anywhere else on the page. */
  function openInMemory(entry) {
    const id = String((entry && entry.id) || '');
    const inLessons = id ? state.lessons.find((l) => l.id === id) : null;
    const inActivity = id ? state.activity.find((l) => l.id === id) : null;
    if (inLessons) { state.mode = 'lessons'; state.selectedEntry = inLessons; }
    else if (inActivity) { state.mode = 'activity'; state.selectedEntry = inActivity; }
    else { state.selectedEntry = entry; }
    state.searchResults = null;
    $('mode-lessons').setAttribute('aria-pressed', String(state.mode === 'lessons'));
    $('mode-activity').setAttribute('aria-pressed', String(state.mode === 'activity'));
    selectTab('memory');
    renderMemory();
    $('memory-detail').scrollIntoView({ block: 'nearest' });
  }

  // -------------------------------------------------------------------------
  // Turns tab
  // -------------------------------------------------------------------------

  const clockMs = (ms) => (ms ? clockOf(new Date(ms).toISOString()) : '—');

  function agentOfSession(sessionId) {
    for (const r of state.runs) {
      const hit = (Array.isArray(r.sessions) ? r.sessions : []).find((s) => s && s.sessionId === sessionId);
      if (hit) return hit.agentId || '';
    }
    return '';
  }

  function renderTurns() {
    const q = $('turn-filter').value.trim().toLowerCase();
    const rows = state.turns.filter((t) => turnMatches(t, q));

    $('turn-count').textContent = String(state.turns.length);

    const runIds = [];
    state.turns.forEach((t) => { if (t.runId && runIds.indexOf(t.runId) < 0) runIds.push(t.runId); });
    const multiRun = runIds.length > 1;
    $('turn-run-head').hidden = !multiRun;
    const fam = currentFamily();

    const body = $('turn-rows');
    clear(body);
    if (!rows.length) {
      const tr = el('tr');
      const td = el('td', 'empty', state.turns.length
        ? 'No turn matches the filter.'
        : 'No turns on disk for this directory. They are pruned after six hours.');
      td.colSpan = 8;
      tr.appendChild(td);
      body.appendChild(tr);
      return;
    }

    const cell = (cls, text, key) => {
      const td = el('td', cls, text);
      td.setAttribute('data-k', key);
      return td;
    };

    const sessions = groupTurnsBySession(rows);
    sessions.forEach((g) => {
      if (sessions.length > 1) {
        const tr = el('tr', 'sesshead');
        const td = el('td', null, 'session ' + shortSession(g.sessionId)
          + (agentOfSession(g.sessionId) ? ' · ' + agentOfSession(g.sessionId) : '')
          + ' · ' + g.rows.length + (g.rows.length === 1 ? ' turn' : ' turns'));
        td.colSpan = 8;
        td.title = g.sessionId || 'no session recorded';
        tr.appendChild(td);
        body.appendChild(tr);
      }
      g.rows.forEach((t) => {
        const tr = el('tr');
        tr.setAttribute('aria-current', String(state.selectedTurn && state.selectedTurn.promptId === t.promptId));

        const time = cell('time', clockMs(t.startedAt), 'time');
        time.title = t.startedAt ? new Date(t.startedAt).toISOString() : '';
        tr.appendChild(time);

        const prompt = cell('prompt', t.promptPreview || '(empty prompt)', 'prompt');
        prompt.title = t.promptPreview || '';
        tr.appendChild(prompt);

        const member = fam ? fam.runs.find((r) => r.runId === t.runId) : null;
        const run = cell(null, member ? member.label : shortId(t.runId, 20), 'run');
        run.title = t.runId || '';
        run.hidden = !multiRun;
        tr.appendChild(run);

        tr.appendChild(cell(null, turnAgentsText(t), 'agents'));
        tr.appendChild(cell('num', t.sources, 'injected'));
        tr.appendChild(cell('num', t.tok, 'tok'));

        const u = usedCell(t.used);
        const used = cell(null, null, 'used');
        const ut = tag(u.text, u.tone === 'ok' ? 'ok' : u.tone === 'unknown' ? 'unknown' : null);
        ut.title = u.title;
        used.appendChild(ut);
        tr.appendChild(used);

        tr.appendChild(cell(null, t.outcomeState || '—', 'outcome'));
        tr.addEventListener('click', () => selectTurn(t));
        body.appendChild(tr);
      });
    });
  }

  async function selectTurn(t) {
    state.selectedTurn = t;
    state.selectedTurnDetail = null;
    renderTurns();
    renderTurnDetail(t);
    try {
      const body = await api('/api/turn?dir=' + enc(state.dir)
        + '&run=' + enc(t.runId || state.run)
        + '&prompt=' + enc(t.promptId));
      if (state.selectedTurn !== t) return;
      state.selectedTurnDetail = Object.assign({}, t, body.turn);
      renderTurnDetail(state.selectedTurnDetail);
    } catch (err) {
      if (state.selectedTurn === t) renderTurnDetail(t);
    }
    if (narrow('(max-width: 64rem)')) $('turn-detail').scrollIntoView({ block: 'nearest' });
  }

  /** Jump to a turn from the Memory tab. */
  function showTurn(turn) {
    const hit = state.turns.find((t) => t.promptId === turn.promptId) || turn;
    selectTab('turns');
    selectTurn(hit);
  }

  /**
   * Resolve a list of ids through /api/entry, four in flight at a time, rendering each line as
   * it lands. The list is the injected memories of a turn or of one of its subagents.
   */
  function renderInjected(box, ids) {
    const ul = el('ul', 'injected');
    box.appendChild(ul);
    const lines = new Map();
    ids.forEach((id) => {
      const li = el('li');
      li.appendChild(el('div', 'm', shortId(id, 36) + ' · resolving…'));
      ul.appendChild(li);
      lines.set(id, li);
    });
    const queue = ids.slice();
    const next = () => {
      const id = queue.shift();
      if (!id) return;
      loadEntry(id).then((entry) => {
        const li = lines.get(id);
        clear(li);
        if (!entry) {
          li.appendChild(el('div', 'm', shortId(id, 36) + ' · not on the instance'));
          return;
        }
        const s = entrySummary(entry);
        const m = el('div', 'm');
        m.appendChild(tag(s.type, 'type'));
        if (s.tool) m.appendChild(el('span', null, s.tool));
        m.appendChild(el('span', null, 'created ' + s.clock));
        if (s.origin) m.appendChild(el('span', null, ORIGIN_WORD[s.origin] || s.origin));
        const where = placement(entry, state.family.bases);
        if (where !== 'here') {
          const f = el('span', where === 'shared' ? 'from' : null, 'from ' + fromText(entry));
          m.appendChild(f);
        }
        const open = el('button', 'btn link', 'Open in Memory');
        open.addEventListener('click', () => openInMemory(entry));
        m.appendChild(open);
        li.appendChild(m);
        li.appendChild(el('div', 'c', s.preview || '(no content)'));
      }).catch((err) => {
        const li = lines.get(id);
        clear(li);
        li.appendChild(el('div', 'm', shortId(id, 36) + ' · ' + (err && err.code === 'not_found' ? 'not on the instance' : 'could not be resolved')));
      }).finally(next);
    };
    for (let i = 0; i < 4; i += 1) next();
  }

  function renderTurnDetail(t) {
    const box = $('turn-detail');
    clear(box);
    if (!t) {
      box.appendChild(el('p', 'empty', 'Select a turn.'));
      return;
    }
    const fam = currentFamily();
    box.appendChild(el('h2', null, 'Prompt ' + shortId(t.promptId, 8) + (t.turnNumber ? ' · turn ' + t.turnNumber : '')));
    box.appendChild(el('p', 'prose', t.prompt || t.promptPreview || ''));

    const dl = el('dl');
    const pair = (k, v) => { dl.appendChild(el('dt', null, k)); const dd = el('dd', null, v); dl.appendChild(dd); return dd; };
    const started = pair('started', t.startedAt ? stampMs(t.startedAt) : '—');
    if (t.startedAt) started.title = new Date(t.startedAt).toISOString();
    pair('ended', t.endedAt ? stampMs(t.endedAt) + (durationText(t.startedAt, t.endedAt) ? ' · ' + durationText(t.startedAt, t.endedAt) : '') : 'still open, or never closed');
    const agent = agentOfSession(t.sessionId);
    const session = pair('session', shortSession(t.sessionId) + (agent ? ' · ' + agent : ''));
    session.title = t.sessionId || '';
    const member = fam ? fam.runs.find((r) => r.runId === t.runId) : null;
    pair('run', (t.runId || state.run) + (member ? ' (' + member.label + ')' : ''));
    pair('recall', t.sources + ' memories · ' + t.tok + ' tok · ' + t.chars + ' chars · ' + t.ptr
      + ' as a pointer · rung ' + rungText(t.rung));
    if (t.emptyReason) pair('empty because', t.emptyReason);
    pair('outcome', t.outcomeState || '—');
    box.appendChild(dl);

    const recalled = Array.isArray(t.recalled) ? t.recalled : [];
    box.appendChild(el('div', 'eyebrow', 'Injected memories (' + recalled.length + ')'));
    if (recalled.length) renderInjected(box, recalled);
    else box.appendChild(el('p', 'note', 'Nothing was injected into this prompt.'));

    const subs = Array.isArray(t.subagents) ? t.subagents : [];
    box.appendChild(el('div', 'eyebrow', 'Subagents (' + subs.length + ')'));
    if (!subs.length) {
      box.appendChild(el('p', 'note', state.selectedTurnDetail === t
        ? 'No subagent ran under this prompt.' : 'Loading…'));
    }
    subs.forEach((s) => {
      const d = el('details', 'subagent');
      const r = s.recall || {};
      const n = Number(s.recalledCount) || 0;
      d.appendChild(el('summary', null, (s.agentType || 'subagent') + ' · started ' + clockMs(s.at)
        + ' · ' + n + (n === 1 ? ' memory' : ' memories') + ' injected · ' + (Number(r.tokens) || 0) + ' tok'
        + (s.subRunId ? ' · ' + s.subRunId : '')));
      let opened = false;
      d.addEventListener('toggle', () => {
        if (!d.open || opened) return;
        opened = true;
        if (n) renderInjected(d, s.recalled || []);
        else d.appendChild(el('p', 'note', 'Nothing was injected into this subagent.'));
      });
      box.appendChild(d);
    });

    const here = state.lessons.filter((l) => placement(l, state.family.bases) === 'here');
    const saved = lessonsInTurn(t, here);
    box.appendChild(el('div', 'eyebrow', 'Saved during this turn (' + saved.length + ')'));
    if (saved.length) {
      const ul = el('ul', 'injected');
      saved.forEach((l) => {
        const li = el('li');
        const m = el('div', 'm');
        m.appendChild(scopeBadge(l));
        if (l.lessonType) m.appendChild(tag(l.lessonType, 'type'));
        m.appendChild(el('span', l.promptId ? null : 'sub', l.promptId ? 'recorded' : 'by time'));
        const open = el('button', 'btn link', 'Open in Memory');
        open.addEventListener('click', () => openInMemory(l));
        m.appendChild(open);
        li.appendChild(m);
        li.appendChild(el('div', 'c', l.content || ''));
        ul.appendChild(li);
      });
      box.appendChild(ul);
    } else box.appendChild(el('p', 'note', 'No lesson from this directory is stamped with, or dated inside, this turn.'));

    const u = t.used || {};
    box.appendChild(el('div', 'eyebrow', 'Used signal'));
    box.appendChild(el('p', 'note', u.used === null || u.used === undefined
      ? 'Not measurable for this turn' + (u.reason ? ' (' + u.reason + ')' : '') + '. A blank here is not "unused".'
      : u.label + ' — term echo: did the reply carry vocabulary from the injected block that was not '
      + 'already in the prompt. False negatives dominate; a "no" is weak, a "yes" is strong.'));
  }

  // -------------------------------------------------------------------------
  // Analytics tab
  // -------------------------------------------------------------------------

  function renderAnalytics(a, health) {
    const box = $('tiles');
    clear(box);
    tileSpecs(a).forEach((spec) => box.appendChild(tile(spec)));
    $('analytics-note').textContent = analyticsNote(a);

    if (!health) return;
    const hb = $('health-tiles');
    clear(hb);
    healthTileSpecs(health).forEach((spec) => hb.appendChild(tile(spec)));
    $('health-note').textContent = healthNote(health);
  }

  // -------------------------------------------------------------------------
  // Polling
  // -------------------------------------------------------------------------

  async function refreshLocal() {
    try {
      const meta = await api('/api/meta?dir=' + enc(state.dir) + '&run=' + enc(state.run));
      state.meta = meta;
      if (!state.dir) state.dir = meta.dir;
      $('endpoint').textContent = meta.configured ? meta.endpoint : 'no endpoint configured';
      renderDirs(meta.dirs || []);

      const q0 = 'dir=' + enc(state.dir);
      const runs = await api('/api/runs?' + q0);
      state.runs = runs.runs || [];
      state.families = groupRunsByDirectory(state.runs);

      if (!state.run) {
        // First arrival, or a directory change. The page opens on the directory it was
        // launched in when that run is here, and on the newest directory otherwise.
        const launch = meta.launch && meta.launch.run;
        const fam = state.families.find((f) => f.runs.some((r) => r.runId === launch)) || state.families[0] || null;
        if (fam) adoptFamily(fam, fam.current);
        else state.run = meta.run || '';
      } else {
        // Membership can grow under the page: a /clear mints a new id in the same directory.
        const fam = state.families.find((f) => f.runs.some((r) => r.runId === state.run));
        if (fam) adoptFamily(fam);
      }

      renderRail();
      renderIdentity();

      if (state.dir && state.run) {
        const turns = await api('/api/turns?' + q0 + '&run=' + enc(state.run) + '&family=1&limit=100');
        state.turns = turns.turns || [];
      } else {
        state.turns = [];
      }
      renderTurns();
      // Attribution reads the turns, so the Memory tab is repainted when they change — and
      // only then, or the one-second poll would rebuild the list under a focused row.
      const sig = state.turns.map((t) => t.promptId + ':' + t.endedAt + ':' + t.subagentCount).join('|') + '|' + state.family.key;
      if (sig !== state.turnsSig) {
        state.turnsSig = sig;
        renderMemory();
      }
      if (bannerCode === 'unauthorized') hideBanner();
    } catch (err) {
      if (err.status === 401) showBanner('unauthorized', err.message);
    }
  }

  /**
   * The analytics half, on a slower clock than the rest of the disk poll.
   *
   * The rollup is a whole file that has to be read and parsed, and it is a *trend* — nothing on
   * it can visibly change between one second and the next, because it grows one row per prompt.
   * Polling it at the turn cadence would parse half a megabyte a second to redraw four
   * identical tiles.
   */
  async function refreshAnalytics() {
    if (!state.dir || !state.run) return;
    try {
      const q = 'dir=' + enc(state.dir) + '&run=' + enc(state.run);
      const [analytics, health] = await Promise.all([
        api('/api/analytics?' + q + '&family=1'),
        api('/api/health/local?' + q),
      ]);
      renderAnalytics(analytics, health);
    } catch (err) {
      if (err.status === 401) showBanner('unauthorized', err.message);
    }
  }

  async function refreshRemote(force) {
    if (!state.meta) return;
    if (!state.meta.configured) {
      setConn(false, 'not configured');
      showBanner('upstream_unreachable', 'No endpoint is configured for this install.');
      state.lessons = [];
      state.activity = [];
      state.loaded = true;
      renderMemory();
      return;
    }
    // The poll waits for the census, rather than counting from when the last one was *issued*.
    //
    // An all-runs census is a scan of the whole feed. Measured against a hosted instance with
    // seven hundred lessons it takes about nineteen seconds — longer than the fifteen-second
    // remote cadence. Counting the gap from the request going out meant the next poll fired
    // while the first was still in the air, superseded it, and left the page reading "Loading…"
    // forever: every answer arrived stale, so none of them was ever rendered. A forced refresh
    // still cuts in, because that is somebody who asked and is waiting.
    if (!force) {
      if (state.remoteBusy) return;
      if (Date.now() - state.lastRemoteAt < (state.meta.pollMs || {}).remote) return;
    }

    // Whoever was issued last wins; anything older lands into a stale sequence and is dropped
    // rather than repainting the answer to the previous question.
    const seq = ++state.reqSeq;
    const stale = () => seq !== state.reqSeq;
    state.remoteBusy += 1;
    try {
      await remoteFetch(stale);
    } finally {
      state.remoteBusy -= 1;
      // From completion, not from dispatch — see above.
      state.lastRemoteAt = Date.now();
    }
  }

  /** The two instance calls the Memory tab is built from. @param {() => boolean} stale */
  async function remoteFetch(stale) {
    // The empty `run` *is* the point: upstream reads it as "every run", and the three views
    // filter what came back — so a directory change never refetches. `currentRun` filters
    // nothing; it is the run `fromOtherRun` is rendered against.
    // `limit` is the census's *page* size, not a cap on the answer, and 500 is the largest the
    // route serves. On this route the cheapest way to finish a scan inside its budget is to ask
    // for fewer, bigger pages: at 200 a seven-hundred-lesson instance ran out of wall clock on
    // page three and reported itself truncated, where two pages of 500 complete.
    const q = 'run=&currentRun=' + encodeURIComponent(state.run) + '&limit=500';

    try {
      const body = await api('/api/lessons?' + q);
      if (stale()) return;
      state.lessons = body.lessons || [];
      state.lessonsError = '';
      state.joinError = String(body.joinError || '');
      // `scopeCounts` and `projectCounts` are on the wire and deliberately not kept: the page
      // counts the rows it is actually showing, and a facet labelled with a number that does
      // not match the list under it is worse than one with no number at all.
      state.census = {
        totalVisible: num(body.totalVisible) || state.lessons.length,
        truncated: !!body.truncated,
        truncatedReason: String(body.truncatedReason || ''),
        pages: num(body.pages),
        source: String(body.source || ''),
        unknownScope: num(body.unknownScope),
      };
      // `joined` says the activity call worked; `dated` says it produced timestamps. They come
      // apart on an instance that stores lessons without a creation time, and a green light
      // over a column of dashes is the version of that a user reads as a bug in this page.
      const dated = state.lessons.length === 0 || body.dated > 0;
      setConn(true, dated ? 'connected' : 'connected · this instance records no lesson dates');
      hideBanner();
    } catch (err) {
      if (stale()) return;
      setConn(false, err.code === 'auth_failed' ? 'key rejected' : 'unreachable');
      showBanner(err.code, err.message);
      state.lessons = [];
      state.census = null;
      state.lessonsError = err.message || 'the request failed';
      state.loaded = true;
      renderMemory();
      return;
    }

    try {
      const body = await api('/api/activity?' + q);
      if (stale()) return;
      state.activity = body.entries || [];
      state.activityError = '';
    } catch (err) {
      if (stale()) return;
      state.activity = [];
      state.activityError = err.message || 'the request failed';
    }
    state.loaded = true;
    renderMemory();
  }

  async function searchInstance() {
    const q = $('filter').value.trim();
    if (!q) { state.searchResults = null; renderMemory(); return; }
    const btn = $('do-search');
    btn.disabled = true;
    btn.textContent = 'searching…';
    try {
      // `/api/search` refuses an empty run, which is why this one call keeps naming the
      // concrete run even though the tab is showing every run's lessons.
      const body = await post('/api/search', { run: state.run, query: q, limit: 30 });
      // Search evidence carries no scope of its own. Stamping a literal onto it was the bug:
      // every result read as run-scoped, so any active scope filter emptied the list and the
      // badge said something the instance had never claimed. Joining by id against what is
      // already loaded recovers the real scope where it can, and everything else is left
      // genuinely unknown — which the badge and the `unknown` filter can both express.
      const byId = new Map();
      state.lessons.forEach((l) => { if (l.id) byId.set(String(l.id), l); });
      state.searchResults = (body.evidence || []).map((e) => {
        const id = String(e.reference_id || e.id || '');
        const hit = byId.get(id) || null;
        return {
          id: id,
          content: e.content || '',
          entry_type: e.entry_type || '',
          lessonType: hit ? hit.lessonType : '',
          scope: hit ? hit.scope : undefined,
          scopeKnown: hit ? hit.scopeKnown : false,
          importance: hit ? hit.importance : '',
          project: hit ? hit.project : '',
          source: e.source || '',
          run_id: e.run_id || '',
          sourceRunId: hit ? hit.sourceRunId : (e.run_id || ''),
          createdAt: hit ? hit.createdAt : '',
          origin: hit ? hit.origin : '',
          sessionId: hit ? hit.sessionId : '',
          promptId: hit ? hit.promptId : '',
          turnNumber: hit ? hit.turnNumber : 0,
        };
      });
      state.searchQuery = q;
      state.selectedEntry = null;
      renderMemory();
      hideBanner();
    } catch (err) {
      showBanner(err.code, err.message);
    }
    btn.disabled = false;
    btn.textContent = 'Search instance';
  }

  // -------------------------------------------------------------------------
  // Wiring
  // -------------------------------------------------------------------------

  function selectTab(name) {
    state.tab = name;
    ['memory', 'turns', 'analytics'].forEach((n) => {
      $('tab-' + n).setAttribute('aria-selected', String(n === name));
      $('panel-' + n).classList.toggle('active', n === name);
    });
  }

  ['memory', 'turns', 'analytics'].forEach((n) => {
    $('tab-' + n).addEventListener('click', () => selectTab(n));
  });

  function setMode(mode) {
    state.mode = mode;
    state.searchResults = null;
    state.searchQuery = '';
    state.selectedEntry = null;
    state.type = '';
    $('mode-lessons').setAttribute('aria-pressed', String(mode === 'lessons'));
    $('mode-activity').setAttribute('aria-pressed', String(mode === 'activity'));
    renderMemory();
  }
  $('mode-lessons').addEventListener('click', () => setMode('lessons'));
  $('mode-activity').addEventListener('click', () => setMode('activity'));

  // The view is a filter over what is loaded, so this is instant and refetches nothing.
  function setView(view) {
    if (state.view === view) return;
    state.view = view;
    state.selectedEntry = null;
    $('runs-this').setAttribute('aria-pressed', String(view === 'here'));
    $('runs-reach').setAttribute('aria-pressed', String(view === 'reach'));
    $('runs-all').setAttribute('aria-pressed', String(view === 'all'));
    renderMemory();
  }
  $('runs-this').addEventListener('click', () => setView('here'));
  $('runs-reach').addEventListener('click', () => setView('reach'));
  $('runs-all').addEventListener('click', () => setView('all'));

  function setSort(order) {
    state.sort = order;
    $('sort-newest').setAttribute('aria-pressed', String(order === 'newest'));
    $('sort-oldest').setAttribute('aria-pressed', String(order === 'oldest'));
    renderMemory();
  }
  $('sort-newest').addEventListener('click', () => setSort('newest'));
  $('sort-oldest').addEventListener('click', () => setSort('oldest'));

  // Instant, over what is already loaded. The instance is only asked when the button is
  // pressed, because a semantic search on every keystroke is a bill.
  // Editing the box hands it back to the instant filter. Leaving the results up while the text
  // that produced them changes underneath would make the box a control that does nothing —
  // it cannot filter them (they are a semantic answer) and it no longer describes them.
  $('filter').addEventListener('input', () => {
    if (state.searchResults) { state.searchResults = null; state.searchQuery = ''; }
    renderMemory();
  });
  $('scope-filter').addEventListener('change', (e) => {
    state.scope = e.target.value;
    renderMemory();
  });
  $('project-filter').addEventListener('change', (e) => {
    state.project = e.target.value;
    renderMemory();
  });
  $('do-search').addEventListener('click', searchInstance);
  $('filter').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') searchInstance();
    if (e.key === 'Escape') {
      state.searchResults = null;
      state.searchQuery = '';
      $('filter').value = '';
      renderMemory();
    }
  });
  $('turn-filter').addEventListener('input', renderTurns);

  $('dirs').addEventListener('change', (e) => {
    state.dir = e.target.value;
    state.run = '';
    state.family = { key: '', ids: [], bases: [], projectDir: '', current: '' };
    state.selectedTurn = null;
    state.selectedTurnDetail = null;
    state.entryCache = new Map();
    state.lastRemoteAt = 0;
    refreshLocal().then(() => { refreshAnalytics(); refreshRemote(true); });
  });

  const THEME_KEY = 'mubit-dashboard-theme';
  function applyTheme(value) {
    if (value) document.documentElement.setAttribute('data-theme', value);
    else document.documentElement.removeAttribute('data-theme');
  }
  try { applyTheme(localStorage.getItem(THEME_KEY)); } catch (e) { /* private mode */ }
  // Toggle from what the viewer is *seeing*, not from the attribute. With no stored choice
  // there is no attribute, so a naive toggle picks a constant — and the first click on a
  // machine already in dark mode sets dark, which reads as a dead button.
  function effectiveTheme() {
    const explicit = document.documentElement.getAttribute('data-theme');
    if (explicit) return explicit;
    try {
      return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    } catch (e) {
      return 'dark';
    }
  }
  $('theme').addEventListener('click', () => {
    const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* private mode */ }
  });

  // Disk is cheap and changes with every prompt; the instance is neither. The two cadences are
  // set by the server so the page and the server cannot drift into disagreeing about them.
  setConn(null, 'connecting');
  // Firefox restores a `<select>`'s value across a reload, which would leave the control
  // showing one filter while `state` held another. The state object is the authority.
  $('scope-filter').value = state.scope;
  syncRail();
  renderMemory();
  refreshLocal().then(() => {
    refreshAnalytics();
    refreshRemote(true);
    const local = (state.meta && state.meta.pollMs && state.meta.pollMs.local) || 1000;
    setInterval(refreshLocal, local);
    setInterval(refreshAnalytics, local * 5);
    // Cheap, and gated inside on the remote cadence the server publishes.
    setInterval(refreshRemote, 1000);
  });
})();
</script>
</body>
</html>
