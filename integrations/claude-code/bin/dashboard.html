<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Mubit memory</title>
<style>
/* Brand tokens. Dark is the base, so an install with no expressed preference gets dark;
   light is opted into by the system setting or by the toggle. The eleven colour tokens are
   shared with the rest of the plugin's UI and are pinned by test/dashboard-layout.test.mjs;
   everything under them is this page's own vocabulary. */
:root {
  --bg: hsl(28 9% 8%);
  --panel: hsl(28 10% 10%);
  --panel-2: hsl(28 10% 13%);
  --border: hsl(28 9% 21%);
  --text: hsl(32 10% 85%);
  --muted: hsl(30 9% 60%);
  --accent: hsl(16 100% 55%);
  --accent-dim: hsl(16 100% 55% / 0.14);
  --success: hsl(142 50% 50%);
  --danger: hsl(0 72% 58%);
  --danger-dim: hsl(0 72% 58% / 0.12);

  /* Hairlines: one-pixel rules at low alpha, so they read as structure rather than as boxes. */
  --hair: hsl(30 10% 60% / 0.14);
  --hair-strong: hsl(30 10% 60% / 0.26);
  /* The accent, lifted enough to pass as text on the dark ground. */
  --accent-ink: hsl(16 100% 62%);
  --surface-hover: hsl(30 10% 60% / 0.08);

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --rail-w: 268px;
  --col-max: 1360px;
  --track: 0.08em;

  --r-sm: 2px;
  --r-md: 4px;
  --r-card: 8px;

  /* System stacks only: the page is served under default-src 'self' and carries no fonts. */
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: hsl(32 36% 97%);
    --panel: hsl(36 50% 99%);
    --panel-2: hsl(32 30% 95%);
    --border: hsl(30 18% 84%);
    --text: hsl(30 22% 14%);
    --muted: hsl(30 10% 42%);
    --accent: hsl(16 100% 50%);
    --accent-dim: hsl(16 100% 50% / 0.12);
    --success: hsl(149 70% 33%);
    --danger: hsl(0 82% 54%);
    --danger-dim: hsl(0 82% 54% / 0.10);
    --hair: hsl(30 10% 30% / 0.14);
    --hair-strong: hsl(30 10% 30% / 0.28);
    --accent-ink: hsl(16 100% 42%);
    --surface-hover: hsl(30 10% 30% / 0.07);
  }
}
:root[data-theme="light"] {
  --bg: hsl(32 36% 97%);
  --panel: hsl(36 50% 99%);
  --panel-2: hsl(32 30% 95%);
  --border: hsl(30 18% 84%);
  --text: hsl(30 22% 14%);
  --muted: hsl(30 10% 42%);
  --accent: hsl(16 100% 50%);
  --accent-dim: hsl(16 100% 50% / 0.12);
  --success: hsl(149 70% 33%);
  --danger: hsl(0 82% 54%);
  --danger-dim: hsl(0 82% 54% / 0.10);
  --hair: hsl(30 10% 30% / 0.14);
  --hair-strong: hsl(30 10% 30% / 0.28);
  --accent-ink: hsl(16 100% 42%);
  --surface-hover: hsl(30 10% 30% / 0.07);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13px/19px var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* The frame: header, banner, identity strip, then the body, which is the only row that
   grows. `main` scrolls inside it; the page itself does not, until the narrow breakpoint
   below hands scrolling back to the page so the strip can scroll away on a phone. */
.app { display: grid; grid-template-rows: auto auto auto 1fr; height: 100vh; height: 100dvh; }

.eyebrow {
  font: 600 11px/16px var(--mono); text-transform: uppercase; letter-spacing: var(--track);
  color: var(--muted);
}

/* ---- header ---------------------------------------------------------- */
header {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: var(--space-2) var(--space-4);
  padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--hair);
}
.brand { display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 500; letter-spacing: -0.01em; }
.brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.spacer { flex: 1 1 auto; }
.endpoint { font: 11px/16px var(--mono); color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 9px; border-radius: 999px; border: 1px solid var(--hair-strong);
  font-size: 11px; color: var(--muted);
}
.pill .led { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill.ok .led { background: var(--success); }
.pill.bad .led { background: var(--danger); }
.iconbtn {
  background: none; border: 1px solid var(--hair-strong); border-radius: var(--r-md);
  padding: 3px 9px; cursor: pointer; font-size: 12px;
}
.iconbtn:hover { background: var(--surface-hover); }

/* ---- banner ---------------------------------------------------------- */
.banner {
  display: none; gap: 10px; align-items: baseline; flex-wrap: wrap;
  padding: 7px var(--space-5); border-bottom: 1px solid var(--hair);
  background: var(--danger-dim); color: var(--text); font-size: 12px;
}
.banner.show { display: flex; }
.banner code { font: 11px/16px var(--mono); color: var(--muted); overflow-wrap: anywhere; }

/* ---- identity strip -------------------------------------------------- */
#identity { border-bottom: 1px solid var(--hair); padding: var(--space-4) var(--space-5); }
.identity-grid {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-4) var(--space-5); max-width: var(--col-max);
}
.cell { min-width: 0; border-left: 1px solid var(--hair); padding-left: var(--space-4); }
.cell:first-child { border-left: 0; padding-left: 0; }
.cell .eyebrow { margin-bottom: var(--space-1); }
#id-run { font: 500 20px/26px var(--mono); overflow-wrap: anywhere; }
#id-run-state { color: var(--muted); font-size: 12px; margin-top: 2px; }
#id-run-note { color: var(--muted); font-size: 12px; }
/* The whole path, wrapped. A truncated path is two projects that look alike. */
#id-path { font: 12px/18px var(--mono); overflow-wrap: anywhere; }
#id-root, #id-datadir { color: var(--muted); font: 11px/16px var(--mono); overflow-wrap: anywhere; margin-top: 2px; }
#id-sessions { overflow-wrap: anywhere; }
#id-session-list { margin-top: var(--space-1); }
#id-session-list summary { cursor: pointer; color: var(--muted); font-size: 12px; }
#id-session-list .sessions { margin-top: var(--space-1); }
#id-session-list .session { font: 11px/17px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
#id-scope p { margin: 0 0 var(--space-1); }
.state-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted); vertical-align: middle; margin-right: 5px;
}
.state-dot.ok { background: var(--success); }
.state-dot.bad { background: var(--danger); }
/* Shown only below 48rem, where the rail is collapsed behind it. */
#rail-toggle { display: none; margin-top: var(--space-2); }

/* ---- body: rail + main ----------------------------------------------- */
.body { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 0; }
#rail { border-right: 1px solid var(--hair); overflow-y: auto; padding: var(--space-3); min-height: 0; }
#rail .eyebrow { margin: var(--space-3) 2px var(--space-2); }
#rail .eyebrow:first-child { margin-top: 2px; }
main { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; }

select, input[type="text"], input[type="search"] {
  width: 100%; background: var(--panel); border: 1px solid var(--hair-strong);
  border-radius: var(--r-md); padding: 4px 8px;
}

.run {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; border-left: 2px solid transparent;
  padding: 6px 8px; margin-bottom: 1px;
}
.run:hover { background: var(--surface-hover); }
.run[aria-current="true"] { background: var(--surface-hover); border-left-color: var(--accent); }
.run .id { font: 12px/17px var(--mono); overflow-wrap: anywhere; }
.run .meta { font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.run .meta .proj { font-family: var(--mono); }

/* One entry per directory: the full path, then its runs as small rows under it. */
.dir { margin-bottom: var(--space-2); }
.dirhead {
  display: block; width: 100%; text-align: left; cursor: pointer; color: inherit;
  background: none; border: 0; border-left: 2px solid transparent; padding: 6px 8px;
}
.dirhead:hover { background: var(--surface-hover); }
.dirhead[aria-current="true"] { background: var(--surface-hover); border-left-color: var(--accent); }
.dirhead .path { font: 12px/17px var(--mono); overflow-wrap: anywhere; }
.dirhead .meta { font-size: 11px; color: var(--muted); }
.dir .run { padding: 3px 8px 3px 18px; margin-bottom: 0; }
.dir .run .id { font-size: 11px; }
.dir .subs { font-size: 11px; color: var(--muted); padding: 2px 8px 2px 18px; }

/* ---- tabs ------------------------------------------------------------ */
nav.tabs { display: flex; gap: var(--space-5); padding: 0 var(--space-5); border-bottom: 1px solid var(--hair); }
nav.tabs button {
  background: none; border: 0; border-bottom: 2px solid transparent;
  padding: 10px 2px; cursor: pointer; color: var(--muted); margin-bottom: -1px;
}
nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tabpanel { display: none; min-height: 0; overflow: auto; padding: var(--space-4) var(--space-5) var(--space-6); }
.tabpanel.active { display: block; }
.panel-inner { max-width: var(--col-max); }

/* ---- shared controls ------------------------------------------------- */
.toolbar { display: flex; gap: var(--space-2); align-items: center; margin-bottom: var(--space-3); flex-wrap: wrap; }
.toolbar > * { flex: 0 0 auto; }
.toolbar .grow { flex: 1 1 220px; min-width: 160px; }
.toolbar select { width: auto; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--hair-strong); border-radius: var(--r-md); overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 11px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--hair-strong); }
.seg button[aria-pressed="true"] { background: var(--surface-hover); color: var(--text); }
.btn {
  background: none; border: 1px solid var(--hair-strong); border-radius: var(--r-md);
  padding: 4px 11px; cursor: pointer;
}
.btn:hover:not(:disabled) { background: var(--surface-hover); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
/* The one accented button on the page: the action that costs something. */
.btn.primary { border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: var(--danger-dim); }
.btn.small { padding: 1px 8px; font-size: 11px; }
/* A facet that cannot answer the question is dimmed rather than hidden. Hiding it would leave
   a person hunting for a control they saw a moment ago; the `title` says why it is off. */
select:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.link { background: none; border: 0; padding: 0 2px; color: var(--accent-ink); text-decoration: underline; }

/* Chip rows: the loaded window counted by scope and by type. */
.chips { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-2); align-items: center; margin: 0 0 var(--space-2); }
.chips:empty { display: none; }
.chips .lbl { margin-right: var(--space-1); }
.chip {
  background: none; border: 1px solid var(--hair-strong); border-radius: 999px;
  padding: 1px 9px; font-size: 11px; color: var(--muted); cursor: pointer;
}
.chip b { font-weight: 500; color: var(--text); font-family: var(--mono); margin-left: 4px; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--text); }
.chip:hover:not(:disabled) { background: var(--surface-hover); }
.chip:disabled { opacity: 0.45; cursor: not-allowed; }

.split { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, 1fr); gap: var(--space-4); align-items: start; }
/* The turns table carries eight columns plus a prompt that has to stay readable, so it takes
   the larger share rather than the master-detail split. */
.split.wide { grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); }
.card { background: var(--panel); border: 1px solid var(--hair); border-radius: var(--r-card); min-width: 0; }
.detail.sticky { position: sticky; top: 0; }

/* ---- the lesson list ------------------------------------------------- */
.dayhead {
  position: sticky; top: 0; z-index: 1; background: var(--panel);
  font: 600 11px/16px var(--mono); text-transform: uppercase; letter-spacing: var(--track);
  color: var(--muted); padding: 8px 12px 5px; border-bottom: 1px solid var(--hair);
}
.dayhead:first-child { border-radius: var(--r-card) var(--r-card) 0 0; }
.item {
  display: flex; gap: 10px; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; border-bottom: 1px solid var(--hair);
  padding: 8px 12px; color: inherit;
}
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--surface-hover); }
.item[aria-current="true"] { background: var(--accent-dim); box-shadow: inset 2px 0 0 var(--accent); }
.item .t { flex: 0 0 44px; font: 11px/18px var(--mono); color: var(--muted); }
.item .main { flex: 1 1 auto; min-width: 0; }
.item .badges { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 2px; }
.item .c {
  font: 14px/21px var(--sans); overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.item .m { font: 11px/16px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; margin-top: 2px; overflow-wrap: anywhere; }

.tag {
  display: inline-block; padding: 0 6px; border-radius: var(--r-sm);
  border: 1px solid var(--hair-strong); font: 11px/17px var(--mono); color: var(--muted);
}
/* Scope tones: `local` is the muted outline above; `shared` is the one place the accent means
   something; `unknown` is dashed because it reports the absence of a fact rather than a fact. */
.tag.shared { color: var(--accent-ink); border-color: var(--accent); }
.tag.ok { color: var(--success); border-color: var(--success); }
.tag.bad { color: var(--danger); border-color: var(--danger); }
.tag.unknown { border-style: dashed; }
.tag.type { text-transform: none; }
/* A fact the page inferred rather than read — "by time", or a subagent it could only guess. */
.tag.sub { border-style: dashed; }
/* In a row's meta line: a fact that was inferred, and a row that came from another directory. */
.item .m .sub { border-bottom: 1px dashed var(--hair-strong); }
.item .m .from { color: var(--accent-ink); }
.item .m .prompt { font-family: var(--sans); font-style: italic; }

/* ---- detail ---------------------------------------------------------- */
.detail { padding: var(--space-4); }
.detail h2 { font: 500 16px/22px var(--sans); margin: 0 0 var(--space-2); }
.detail .reach { margin: 0 0 var(--space-3); }
/* The provenance block: one line per fact, no paragraphs. */
.detail .prov { font: 12px/18px var(--mono); color: var(--muted); margin: 0 0 var(--space-3); }
.detail .prov div { overflow-wrap: anywhere; }
.detail .prov .btn.link { font: inherit; margin-left: 6px; }
.detail .prov b { font-weight: 500; color: var(--text); }
/* Injected memories and subagents under a turn. */
.injected { margin: 0; padding: 0; list-style: none; }
.injected li { padding: 6px 0; border-bottom: 1px solid var(--hair); }
.injected li:last-child { border-bottom: 0; }
.injected .c { font: 13px/19px var(--sans); overflow-wrap: anywhere; margin-top: 2px; }
.injected .m { font: 11px/16px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.subagent { border-top: 1px solid var(--hair); padding: 4px 0; }
.subagent summary { cursor: pointer; font: 12px/18px var(--mono); }
.subagent .injected { margin-left: var(--space-3); }
.detail .eyebrow { margin: var(--space-4) 0 var(--space-1); }
.detail dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; margin: var(--space-3) 0 0; }
.detail dt { color: var(--muted); font-size: 12px; }
.detail dd { margin: 0; font: 12px/18px var(--mono); overflow-wrap: anywhere; }
.detail dd .btn { margin-left: 6px; vertical-align: baseline; }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/21px var(--sans); margin: 0; }
.empty { color: var(--muted); padding: 22px 14px; text-align: center; }

/* ---- tables ---------------------------------------------------------- */
.scroll-x { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--hair); white-space: nowrap; vertical-align: top; }
th { color: var(--muted); font: 600 11px/16px var(--mono); text-transform: uppercase; letter-spacing: var(--track); }
td.num, th.num { text-align: right; font-family: var(--mono); }
td.time { font-family: var(--mono); color: var(--muted); }
td.prompt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 1px; width: 100%; }
/* Under horizontal scroll the time column stays put, so a row can still be placed in time. */
#panel-turns th:first-child, #panel-turns td:first-child {
  position: sticky; left: 0; z-index: 1; background: var(--panel);
  box-shadow: inset -1px 0 0 var(--hair);
}
/* A session header inside the table, when the directory's turns span more than one session. */
tr.sesshead td {
  font: 600 11px/16px var(--mono); text-transform: uppercase; letter-spacing: var(--track);
  color: var(--muted); background: var(--panel-2); white-space: normal; cursor: default;
}
tr.sesshead:hover td { background: var(--panel-2); }
/* The run column is shown only when the family has more than one run; `hidden` must win over
   the card-row rule below, which sets every cell to display: block. */
#panel-turns [hidden] { display: none; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-hover); }
tbody tr[aria-current="true"] td { background: var(--accent-dim); }
#panel-turns tbody tr:hover td:first-child { background: var(--panel-2); }
#panel-turns tbody tr[aria-current="true"] td:first-child {
  background: var(--panel-2); box-shadow: inset 2px 0 0 var(--accent), inset -1px 0 0 var(--hair);
}

/* ---- tiles ----------------------------------------------------------- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); }
.tile { padding: var(--space-3) var(--space-4); }
.tile .v { font: 500 28px/32px var(--mono); margin-top: 4px; overflow-wrap: anywhere; }
.tile .u { font: 12px/16px var(--sans); color: var(--muted); margin-left: 5px; }
.tile .s { font-size: 11px; line-height: 16px; color: var(--muted); margin-top: 2px; }
.tile svg { display: block; width: 100%; height: 30px; margin-top: 6px; }
.note { color: var(--muted); font-size: 11px; line-height: 16px; margin: var(--space-3) 2px 0; }
.section-label { margin: var(--space-5) 0 var(--space-2); }

.confirm { border-top: 1px solid var(--hair); margin-top: var(--space-4); padding-top: var(--space-3); }
.confirm input { font-family: var(--mono); }
.row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* ---- responsive: nothing hidden, only collapsed behind a visible control ---- */
@media (max-width: 64rem) {
  .identity-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cell:nth-child(3) { border-left: 0; padding-left: 0; }
  .split.wide { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 60rem) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .detail.sticky { position: static; }
}
@media (max-width: 48rem) {
  /* The page scrolls as a whole here, so the identity strip can scroll away on a phone. */
  .app { height: auto; min-height: 100vh; min-height: 100dvh; }
  .tabpanel { overflow: visible; }
  .body { grid-template-columns: minmax(0, 1fr); }
  #rail { display: none; border-right: 0; border-bottom: 1px solid var(--hair); }
  .body.rail-open #rail { display: block; }
  #rail-toggle { display: inline-flex; }
  .identity-grid { grid-template-columns: minmax(0, 1fr); }
  .cell { border-left: 0; padding-left: 0; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .toolbar .grow { flex-basis: 100%; }
}
@media (max-width: 40rem) {
  header { padding: var(--space-2) var(--space-4); }
  #identity, .tabpanel { padding-left: var(--space-4); padding-right: var(--space-4); }
  nav.tabs { padding: 0 var(--space-4); gap: var(--space-4); }
  .seg, .toolbar select, .toolbar .btn { width: 100%; }
  .seg button { flex: 1 1 0; }
  .tiles { grid-template-columns: minmax(0, 1fr); }
  .item .t { flex-basis: 40px; }
}
@media (max-width: 520px) {
  /* The turns table becomes card rows: each cell carries its own column label. */
  #panel-turns thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  #panel-turns table, #panel-turns tbody, #panel-turns tr, #panel-turns td { display: block; }
  #panel-turns tr { border-bottom: 1px solid var(--hair); padding: 6px 0; }
  #panel-turns td { border: 0; white-space: normal; padding: 2px 10px; }
  #panel-turns td:first-child { position: static; box-shadow: none; background: none; }
  #panel-turns td::before {
    content: attr(data-k); display: inline-block; min-width: 68px; color: var(--muted);
    font: 600 11px/16px var(--mono); text-transform: uppercase; letter-spacing: var(--track);
  }
  #panel-turns td.prompt {
    max-width: none; width: auto; overflow: hidden; text-overflow: clip; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  }
  #panel-turns td.num { text-align: left; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand"><span class="dot"></span>Mubit memory</span>
    <span class="endpoint" id="endpoint"></span>
    <span class="spacer"></span>
    <span class="pill" id="conn" aria-live="polite"><span class="led"></span><span id="conn-text">connecting</span></span>
    <button class="iconbtn" id="theme" title="Switch between light and dark">theme</button>
  </header>

  <div class="banner" id="banner" role="status">
    <strong id="banner-title"></strong>
    <span id="banner-text"></span>
    <code id="banner-code"></code>
  </div>

  <!-- Everything on the page is anchored on the selected directory: its family of run ids,
       the run the newest session maps to, the sessions that share it, and what it writes at
       and reads from. -->
  <section id="identity" aria-label="Selected directory">
    <div class="identity-grid">
      <div class="cell">
        <div class="eyebrow">Directory</div>
        <div id="id-path">—</div>
        <div id="id-root"></div>
        <div id="id-datadir"></div>
      </div>
      <div class="cell">
        <div class="eyebrow">Run</div>
        <div id="id-run">—</div>
        <div id="id-run-state"></div>
        <div id="id-run-note"></div>
      </div>
      <div class="cell">
        <div class="eyebrow">Sessions</div>
        <div id="id-sessions">—</div>
        <details id="id-session-list">
          <summary>every session</summary>
          <div class="sessions"></div>
        </details>
        <button class="btn" id="rail-toggle" aria-expanded="false" aria-controls="rail">Change directory</button>
      </div>
      <div class="cell">
        <div class="eyebrow">Scope</div>
        <div id="id-scope"></div>
      </div>
    </div>
  </section>

  <div class="body" id="body">
    <aside id="rail" aria-label="Data directories and project directories">
      <div class="eyebrow">Data directory</div>
      <select id="dirs" aria-label="Data directory"></select>

      <div class="eyebrow">Directories</div>
      <div id="runs"></div>
    </aside>

    <main>
      <nav class="tabs" role="tablist">
        <button role="tab" id="tab-memory" aria-selected="true" aria-controls="panel-memory">Memory</button>
        <button role="tab" id="tab-turns" aria-selected="false" aria-controls="panel-turns">Turns</button>
        <button role="tab" id="tab-analytics" aria-selected="false" aria-controls="panel-analytics">Analytics</button>
      </nav>

      <!-- ---------------- Memory ---------------- -->
      <section class="tabpanel active" id="panel-memory" role="tabpanel" aria-labelledby="tab-memory">
        <div class="panel-inner">
          <div class="toolbar">
            <span class="seg" role="group" aria-label="Source">
              <button id="mode-lessons" aria-pressed="true">Lessons</button>
              <button id="mode-activity" aria-pressed="false">Everything stored</button>
            </span>
            <!-- Three views over one load. The fetch always asks for every run; these filter
                 what came back, so switching directory or view is instant and the counts are
                 the truth about the list under them. -->
            <span class="seg" role="group" aria-label="View">
              <button id="runs-this" aria-pressed="true" title="Lessons this directory's runs saved">Written here <b>0</b></button>
              <button id="runs-reach" aria-pressed="false" title="Plus session and global lessons other directories saved, which reach here at recall">+ shared <b>0</b></button>
              <button id="runs-all" aria-pressed="false" title="Every lesson on the instance">Everything <b>0</b></button>
            </span>
            <span class="seg" role="group" aria-label="Order">
              <button id="sort-newest" aria-pressed="true">Newest first</button>
              <button id="sort-oldest" aria-pressed="false">Oldest first</button>
            </span>
            <input class="grow" type="search" id="filter" placeholder="Filter what is loaded (instant)" aria-label="Filter loaded entries">
            <!-- One control, not a value plus a "leaks?" toggle. Reach and exact scope are the same
                 axis asked at two grains, and two controls would let a person select "global" and
                 "only its own run" at once — a state with no rows in it by construction. -->
            <select id="scope-filter" aria-label="Scope filter">
              <option value="">Every scope</option>
              <optgroup label="Reach">
                <option value="leak">Visible outside its own run</option>
                <option value="run">Only its own run</option>
              </optgroup>
              <optgroup label="Exact">
                <option value="session">session</option>
                <option value="global">global</option>
                <!-- `org` is written by promotion and by nothing on the client, so offering it on an
                     instance that has never promoted anything is offering a guaranteed empty result.
                     It is unhidden by `syncScopeVocabulary()` the moment a loaded row carries it. -->
                <option value="org" hidden disabled>org</option>
                <option value="unknown">scope not recorded</option>
              </optgroup>
            </select>
            <select id="project-filter" aria-label="Project filter"></select>
            <button class="btn primary" id="do-search" title="Ask the instance, rather than filtering what is already loaded">Search instance</button>
          </div>

          <div class="chips" id="scope-summary" aria-label="Loaded rows by scope"></div>
          <div class="chips" id="type-summary" aria-label="Loaded rows by type"></div>

          <div class="split">
            <div class="card list" id="memory-list"></div>
            <div class="card detail sticky" id="memory-detail"><p class="empty">Select an entry.</p></div>
          </div>
          <p class="note" id="memory-footer" aria-live="polite"></p>
          <p class="note" id="memory-scope-note"></p>
        </div>
      </section>

      <!-- ---------------- Turns ---------------- -->
      <section class="tabpanel" id="panel-turns" role="tabpanel" aria-labelledby="tab-turns">
        <div class="panel-inner">
          <div class="toolbar">
            <input class="grow" type="search" id="turn-filter" placeholder="Filter prompts" aria-label="Filter turns">
            <span class="pill" title="Turn files are pruned six hours after they are written, so this is the recent past only. There is no per-prompt latency column because none is recorded: the timing on the status marker describes the last prompt, not each one."><span id="turn-count">0</span>&nbsp;turns on disk</span>
          </div>
          <div class="split wide">
            <div class="card scroll-x">
              <table>
                <thead><tr>
                  <th>time</th><th>Prompt</th><th id="turn-run-head" hidden>run</th><th>agents</th>
                  <th class="num">injected</th><th class="num">tok</th><th>used</th><th>outcome</th>
                </tr></thead>
                <tbody id="turn-rows"></tbody>
              </table>
            </div>
            <div class="card detail" id="turn-detail"><p class="empty">Select a turn.</p></div>
          </div>
        </div>
      </section>

      <!-- ---------------- Analytics ---------------- -->
      <section class="tabpanel" id="panel-analytics" role="tabpanel" aria-labelledby="tab-analytics">
        <div class="panel-inner">
          <div class="eyebrow section-label">Recall, per prompt, across this directory's runs</div>
          <div class="tiles" id="tiles"></div>
          <p class="note" id="analytics-note"></p>

          <div class="eyebrow section-label">Ingest health</div>
          <div class="tiles" id="health-tiles"></div>
          <p class="note" id="health-note"></p>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
(() => {
  'use strict';

  // -------------------------------------------------------------------------
  // Transport
  // -------------------------------------------------------------------------

  // The token arrives in the launch URL because a browser navigating to a page cannot set a
  // header. It is lifted out immediately and the address bar is rewritten, so it does not sit
  // in history or in whatever the user pastes into a bug report. Every call after this one
  // carries it as an Authorization header instead.
  const params = new URLSearchParams(location.search);
  const AUTH = params.get('token') || '';
  if (AUTH) history.replaceState({}, '', location.pathname);

  const state = {
    meta: null,
    dir: '',
    // The concrete run every write route, search and remote health names. It is the run the
    // selected directory's newest session maps to, or the one the user picked in the rail.
    run: '',
    runs: [],
    // Every directory in the data dir, as families of run ids (`groupRunsByDirectory`).
    families: [],
    // The selected directory: its family's ids and directory keys. Everything the page shows
    // is anchored on this, and it is what the Memory views filter against.
    family: { key: '', ids: [], bases: [], projectDir: '', current: '' },
    // `here` (written by this directory's runs), `reach` (plus what other directories saved
    // at a scope that reaches here), `all`. A client-side filter over one load: the fetch
    // always asks for every run, so changing directory or view never refetches.
    view: 'here',
    mode: 'lessons',
    tab: 'memory',
    sort: 'newest',
    lessons: [],
    activity: [],
    turns: [],
    turnsSig: '',
    scope: '',
    project: '',
    type: '',
    selectedEntry: null,
    selectedTurn: null,
    selectedTurnDetail: null,
    searchResults: null,
    searchQuery: '',
    lastRemoteAt: 0,
    // How many remote refreshes are in the air. The poll declines to add to it; only a forced
    // refresh cuts in, so a census slower than the cadence cannot be lapped by its own timer.
    remoteBusy: 0,
    // "" is not the same as "not asked yet", and neither is the same as "the call failed".
    // Collapsing the three is what made an unreachable instance render as an empty one.
    loaded: false,
    lessonsError: '',
    activityError: '',
    joinError: '',
    // The census the server counted before paging, which is the only number that can tell a
    // person their filter matched nothing rather than their instance holding nothing.
    census: null,
    // A slow fetch started before a fast one must not land after it and repaint the older
    // answer. Every render path checks the sequence it was issued under.
    reqSeq: 0,
    // What the identity strip and the rail last rendered, so the one-second poll rewrites
    // them only when something in them changed — a rebuild every tick would close the session
    // list and steal focus from whatever was pressed.
    identitySig: '',
    railSig: '',
    railOpen: false,
    // Entries resolved by id through /api/entry, keyed by id. A resolved entry is the same
    // whichever turn or row asked for it, and the injected-memories list asks in bursts.
    entryCache: new Map(),
    entryInflight: new Map(),
  };

  async function api(path, init) {
    const res = await fetch(path, Object.assign({}, init, {
      headers: Object.assign(
        { authorization: 'Bearer ' + AUTH },
        init && init.body ? { 'content-type': 'application/json' } : {},
        (init && init.headers) || {},
      ),
    }));
    const text = await res.text();
    let body = null;
    try { body = text ? JSON.parse(text) : null; } catch (e) { body = null; }
    if (!res.ok) {
      const err = new Error((body && body.error && body.error.message) || ('HTTP ' + res.status));
      err.code = (body && body.error && body.error.code) || 'bad_request';
      err.status = res.status;
      throw err;
    }
    return body;
  }

  const post = (path, payload) => api(path, { method: 'POST', body: JSON.stringify(payload) });
  const enc = encodeURIComponent;

  // -------------------------------------------------------------------------
  // Rendering helpers
  // -------------------------------------------------------------------------

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  };
  const clear = (node) => { while (node.firstChild) node.removeChild(node.firstChild); };
  const num = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);
  const narrow = (q) => {
    try { return window.matchMedia(q).matches; } catch (e) { return false; }
  };

  function tag(text, cls) {
    return el('span', 'tag' + (cls ? ' ' + cls : ''), text);
  }

  /**
   * A sparkline, drawn by hand because a charting library is a dependency and this is six
   * lines of arithmetic. A flat series still draws a line rather than collapsing to nothing.
   */
  function sparkline(values) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 100 30');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');
    if (!values.length) return svg;

    const lo = Math.min.apply(null, values);
    const hi = Math.max.apply(null, values);
    const span = hi - lo || 1;
    const step = values.length > 1 ? 100 / (values.length - 1) : 0;
    const points = values.map((v, i) => {
      const x = values.length > 1 ? i * step : 50;
      const y = 28 - ((v - lo) / span) * 26;
      return x.toFixed(2) + ',' + y.toFixed(2);
    }).join(' ');

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    line.setAttribute('points', points);
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', 'currentColor');
    line.setAttribute('stroke-width', '1.5');
    line.setAttribute('vector-effect', 'non-scaling-stroke');
    svg.appendChild(line);
    svg.style.color = 'var(--accent)';
    return svg;
  }

  /** A metric as a big number, its unit, and the line that says how it was measured. */
  function tile(spec) {
    const card = el('div', 'card tile');
    card.appendChild(el('div', 'eyebrow', spec.key));
    const v = el('div', 'v', spec.value);
    if (spec.unit) v.appendChild(el('span', 'u', spec.unit));
    card.appendChild(v);
    if (spec.method) card.appendChild(el('div', 's', spec.method));
    if (spec.series && spec.series.length > 1) card.appendChild(sparkline(spec.series));
    return card;
  }

  // -------------------------------------------------------------------------
  // Banner
  // -------------------------------------------------------------------------

  const BANNER_TEXT = {
    upstream_unreachable: ['Instance unreachable',
      'Lessons, activity and search are unavailable. Everything on disk — turns, analytics and '
      + 'ingest health — is still live below.'],
    auth_failed: ['Instance rejected the key',
      'The stored API key is wrong, revoked, or issued for a different instance. Run '
      + '/mubit-memory:auth in Claude Code to replace it.'],
    bad_request: ['Request refused', 'The dashboard refused its own request rather than sending it.'],
    unauthorized: ['Token expired',
      'This page was opened with a token from an earlier launch. Run /mubit-memory:dashboard again.'],
    not_found: ['Nothing there', 'The route or entry asked for does not exist.'],
  };

  let bannerCode = '';
  function showBanner(code, detail) {
    if (bannerCode === code) return;
    bannerCode = code;
    const copy = BANNER_TEXT[code] || ['Something went wrong', ''];
    $('banner-title').textContent = copy[0];
    $('banner-text').textContent = copy[1];
    $('banner-code').textContent = detail ? String(detail).slice(0, 220) : '';
    $('banner').classList.add('show');
  }
  function hideBanner() {
    bannerCode = '';
    $('banner').classList.remove('show');
  }
  function setConn(ok, text) {
    const pill = $('conn');
    pill.classList.toggle('ok', ok === true);
    pill.classList.toggle('bad', ok === false);
    $('conn-text').textContent = text;
  }

  // -------------------------------------------------------------------------
  // Row semantics
  // -------------------------------------------------------------------------

  // #region scope-predicate
  /*
   * Everything between the region markers is sliced out of this file verbatim by
   * test/dashboard-page.test.mjs and run in a bare `node:vm` context, which is why it may not
   * touch `state`, `$`, `document` or anything else in the page: the slice has to evaluate on
   * its own or the truth table below is untested. Add nothing impure here.
   *
   * Three sources now feed the same list — the activity census, the lessons fallback and
   * `/api/search` — and they carry rows of different fidelity. So `leaksScope` and
   * `fromOtherRun` are *derived here* rather than read off the wire, even though the server
   * sends both: a row that came back from search has no scope of its own to speak of, and one
   * page that computes a fact one way is easier to trust than three that receive it.
   */

  /** Every scope a lesson can come back with. `org` arrives only by promotion, never from a client. */
  const SCOPE_VALUES = ['run', 'session', 'global', 'org'];

  /**
   * The scope this row has *as far as the instance is concerned*.
   *
   * An absent scope becomes `run`, because that is what such a lesson reads as everywhere else
   * it is asked for — a page that invented a fifth bucket for it would disagree with every other
   * view of the same entry. That it arrived unrecorded is a separate fact, and
   * `scopeKnown` is where it lives.
   */
  function scopeOf(row) {
    const raw = row && row.scope != null ? String(row.scope) : '';
    return raw === '' ? 'run' : raw;
  }

  /** Did anything actually record a scope, or did the default supply one? */
  function scopeKnown(row) {
    if (row && typeof row.scopeKnown === 'boolean') return row.scopeKnown;
    return !!(row && row.scope != null && String(row.scope) !== '');
  }

  /** Visible to runs other than the one that wrote it — the promise the Memory tab sells. */
  function leaksScope(row) {
    return scopeOf(row) !== 'run';
  }

  /**
   * Written by some run other than the one the rail is pointing at. A rendering fact only: it
   * says where the reader is standing, and nothing about the entry's reach.
   */
  function fromOtherRun(row, currentRun) {
    const src = String((row && (row.sourceRunId || row.run_id)) || '');
    return !!(currentRun && src && src !== String(currentRun));
  }

  /**
   * `unknown` overlaps `run` on purpose. "Nothing recorded a scope" and "this is run-scoped"
   * are different facts about the same rows, and a person auditing what leaks needs to be able
   * to ask which of the two they are looking at. Excluding an unrecorded row from `run` would
   * be the page disagreeing with the instance about where that lesson is visible.
   */
  function matchesScope(row, filter) {
    if (!filter) return true;
    if (filter === 'leak') return leaksScope(row);
    if (filter === 'unknown') return !scopeKnown(row);
    return scopeOf(row) === filter;
  }

  /**
   * A `repo:` slug is derived from a git remote URL, so it never contains whitespace — which
   * makes a key with a leading space one that no real project can collide with. It has to be a
   * distinct value rather than the empty string, because the empty string already means
   * "every project" on the select.
   */
  const NO_PROJECT = ' no-project-tag';

  function projectOf(row) {
    const p = String((row && row.project) || '');
    return p === '' ? NO_PROJECT : p;
  }

  function matchesProject(row, filter) {
    return !filter || projectOf(row) === filter;
  }

  /**
   * Scope is deliberately *not* in the haystack. It used to be, and the words it contributes
   * are "run", "session" and "global" — so typing `run` matched every row on the page, which
   * is the one query a person looking at a scope filter is most likely to type.
   */
  function matchesText(row, needle) {
    if (!needle) return true;
    const hay = [
      (row && row.content) || '',
      (row && (row.lessonType || row.entry_type)) || '',
      (row && (row.sourceRunId || row.run_id)) || '',
      (row && row.project) || '',
    ].join(' ').toLowerCase();
    return hay.indexOf(needle) >= 0;
  }
  // #endregion scope-predicate

  // #region identity-model
  /*
   * The identity strip's arithmetic: which directory, which runs belong to it, whose sessions,
   * in what words. Pure for the same reason as the region above — the test slices it out and
   * runs it with a fixed clock, so every "ago" and every fallback is a table rather than a
   * screenshot.
   *
   * A directory's memory is spread over several run ids: `cc-<slug>-<hash8>` at first, `-c<N>`
   * after each `/clear`, `-sub-<id>` for every subagent, and the activity feed spells the same
   * run `state::<uid>::cc-…`. `plainRunId` and `baseRunId` fold those back to one directory
   * key. `lib/dashboard-data.mjs` carries the same two functions and the test pins the copies
   * to each other.
   */

  const FEED_PREFIX = /^state::[^:]*::/;
  const SUB_SUFFIX = /-sub-[a-z0-9]+$/;
  const CLEAR_SUFFIX = /-c(\d+)$/;
  /** A `-c<N>` is stripped only when what is left still looks like a directory key: a `static` id may end in `-c1` itself. */
  const DIRECTORY_KEY = /^cc-.+-[0-9a-f]{8}$/;

  function plainRunId(id) {
    return String(id || '').replace(FEED_PREFIX, '');
  }

  function baseRunId(id) {
    const s = plainRunId(id).replace(SUB_SUFFIX, '');
    const m = CLEAR_SUFFIX.exec(s);
    if (!m) return s;
    const head = s.slice(0, m.index);
    return DIRECTORY_KEY.test(head) ? head : s;
  }

  function isSubRun(id) {
    return SUB_SUFFIX.test(plainRunId(id));
  }

  /** `N` from a `-c<N>` that `baseRunId` strips, else 0. */
  function clearIndexOf(id) {
    const s = plainRunId(id).replace(SUB_SUFFIX, '');
    const m = CLEAR_SUFFIX.exec(s);
    return m && baseRunId(id) === s.slice(0, m.index) ? Number(m[1]) : 0;
  }

  const STRATEGY_LABEL = {
    'per-directory': 'one run per directory',
    'git-branch': 'one run per git branch',
    'per-conversation': 'one run per host session',
    static: 'a fixed run id',
  };

  function strategyLabel(s) {
    const k = String(s || '');
    return STRATEGY_LABEL[k] || (k ? 'strategy "' + k + '"' : 'strategy unknown');
  }

  // Fallback wording only. The server's `describeRunScope` is the authority and its text wins
  // whenever the meta carries one; these exist so a page served by an older bundle still says
  // something true rather than nothing.
  const WRITES_AT_TEXT = {
    run: 'lessons an agent saves stay inside this run',
    session: 'lessons an agent saves can surface in later sessions of this project',
    global: 'lessons an agent saves are visible to every run on this instance',
  };
  const READS_ACROSS_TEXT = {
    auto: 'recall consults other runs when at least 3 s of budget remains',
    on: 'every recall consults other runs',
    off: 'recall never consults other runs; only the session-start briefing does',
  };

  /** The two sentences the Scope cell shows, from the server's scope block. */
  function scopeSentences(scope) {
    const s = scope && typeof scope === 'object' ? scope : {};
    const writesAt = String(s.writesAt || 'session');
    const reads = String(s.readsAcrossRuns || 'auto');
    const writesText = String(s.writesAtText || WRITES_AT_TEXT[writesAt]
      || ('lessons an agent saves are capped at "' + writesAt + '" scope'));
    const readsText = String(s.readsAcrossRunsText || READS_ACROSS_TEXT[reads]
      || ('cross-run recall is set to "' + reads + '"'));
    return {
      writes: 'Writes: hook captures stay at run scope; ' + writesText + ' (cap: ' + writesAt + ').',
      reads: 'Reads: ' + readsText + ' (cross-run: ' + reads + ').',
    };
  }

  /** A path split for display: everything up to the last separator, and the last segment. */
  function pathParts(path) {
    const full = String(path || '');
    const m = /^(.*[\/\\])([^\/\\]+)[\/\\]?$/.exec(full);
    if (!m) return { full: full, head: '', tail: full };
    return { full: full, head: m[1], tail: m[2] };
  }

  /** A subagent's marker is `<parent>-sub-<id>`; nothing is stored under it, so it borrows. */
  function parentRunId(id) {
    const s = String(id || '');
    const at = s.indexOf('-sub-');
    return at > 0 ? s.slice(0, at) : s;
  }

  function relativeTime(ms, now) {
    const t = typeof ms === 'number' && isFinite(ms) && ms > 0 ? ms : 0;
    if (!t) return '—';
    const ref = typeof now === 'number' ? now : Date.now();
    const s = Math.floor(Math.max(0, ref - t) / 1000);
    if (s < 10) return 'just now';
    if (s < 60) return s + 's ago';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    return Math.floor(h / 24) + 'd ago';
  }

  function runStateTone(st) {
    const s = String(st || '');
    if (s === 'ready') return 'ok';
    if (s === 'unreachable' || s === 'auth_failed' || s === 'invalid_request') return 'bad';
    return 'muted';
  }

  function shortSession(id) {
    const s = String(id || '');
    if (!s) return '—';
    return s.length > 10 ? s.slice(0, 5) + '…' + s.slice(-3) : s;
  }

  function sessionLabel(s, now) {
    const x = s && typeof s === 'object' ? s : {};
    const parts = [
      shortSession(x.sessionId),
      x.agentId || 'agent unknown',
      'first seen ' + relativeTime(x.createdAt, now),
      'last seen ' + relativeTime(x.lastSeenAt, now),
    ];
    if (Number(x.clearCount) > 0) parts.push('cleared ' + x.clearCount + '×');
    return parts.join(' · ');
  }

  /**
   * Everything the strip renders, from a run row, the meta, and the run list (for a subagent
   * marker to borrow its parent's sessions). The launch directory is the fallback only for
   * the launch run — the one run that can be identified without a session record at all.
   * Any other run with no record has no directory, and guessing one would be worse than blank.
   */
  function runIdentity(run, meta, runs) {
    const r = run && typeof run === 'object' ? run : {};
    const m = meta && typeof meta === 'object' ? meta : {};
    const launch = m.launch && typeof m.launch === 'object' ? m.launch : {};
    const runId = String(r.runId || '');
    const parent = parentRunId(runId);
    let sessions = Array.isArray(r.sessions) ? r.sessions : [];
    if (!sessions.length && parent !== runId && Array.isArray(runs)) {
      const p = runs.find((x) => x && x.runId === parent);
      if (p && Array.isArray(p.sessions)) sessions = p.sessions;
    }
    const newest = sessions.length ? sessions[0] : null;
    const launchRun = String(launch.run || '');
    const isLaunchRun = !!runId && !!launchRun && (runId === launchRun || parent === launchRun);
    return {
      runId: runId,
      isLaunchRun: isLaunchRun,
      state: String(r.state || 'unknown'),
      mode: String(r.mode || ''),
      lastWrite: Number(r.lastWrite) || 0,
      sessions: sessions,
      newest: newest,
      sessionCount: sessions.length,
      clearTotal: sessions.reduce((a, s) => a + (Number(s && s.clearCount) || 0), 0),
      projectDir: String(r.projectDir || (newest && newest.projectDir)
        || (isLaunchRun ? launch.projectDir : '') || ''),
      projectRoot: String(r.projectRoot || (newest && newest.projectRoot) || ''),
    };
  }

  /** What a rebuild of the strip would change. Same string, same strip, no DOM writes. */
  function identitySignature(id) {
    const x = id && typeof id === 'object' ? id : {};
    return [
      x.runId, x.isLaunchRun, x.state, x.mode, x.sessionCount, x.clearTotal, x.projectDir, x.projectRoot,
    ].concat((x.sessions || []).map((s) => s.sessionId + ':' + s.lastSeenAt + ':' + s.clearCount)).join('|');
  }

  /**
   * Run rows grouped into families, to a fixpoint: two runs belong together when they share a
   * directory key, or when their session records share a project root. The first rule folds
   * `cc-x-<hash>` with its `/clear` and subagent ids; the second is what groups a `static` or
   * `per-conversation` run with the directory it was used in, without guessing from the id.
   */
  function familiesOf(runs) {
    const rows = (Array.isArray(runs) ? runs : []).filter((r) => r && r.runId);
    const groups = [];
    rows.forEach((r) => {
      const base = baseRunId(r.runId);
      const root = String(r.projectRoot || '');
      const hits = groups.filter((g) => g.bases.has(base) || (root && g.roots.has(root)));
      let g = hits[0];
      if (!g) {
        g = { rows: [], bases: new Set(), roots: new Set() };
        groups.push(g);
      }
      hits.slice(1).forEach((h) => {
        h.rows.forEach((x) => g.rows.push(x));
        h.bases.forEach((b) => g.bases.add(b));
        h.roots.forEach((x) => g.roots.add(x));
        groups.splice(groups.indexOf(h), 1);
      });
      g.rows.push(r);
      g.bases.add(base);
      if (root) g.roots.add(root);
    });
    return groups;
  }

  /** What a run is to its family: the one the newest session maps to, an earlier one, a clear, a subagent. */
  function runLabel(id, fam) {
    const f = fam && typeof fam === 'object' ? fam : {};
    const rid = String(id || '');
    if (isSubRun(rid)) return 'subagent';
    if (rid === String(f.current || '')) return 'current';
    const n = clearIndexOf(rid);
    if (n > 0) return 'after /clear ×' + n;
    const base = baseRunId(rid);
    const cleared = (f.runs || []).some((r) => r && baseRunId(r.runId) === base && clearIndexOf(r.runId) > 0);
    return cleared ? 'before /clear' : 'earlier';
  }

  /**
   * One entry per directory, newest first, each with its runs newest first and labelled. The
   * directory is the one the family's newest session names; `current` is the run that session
   * maps to, which is the id every write route on the page uses.
   */
  function groupRunsByDirectory(runs) {
    return familiesOf(runs).map((g) => {
      const sorted = g.rows.slice().sort((a, b) => (Number(b.lastWrite) || 0) - (Number(a.lastWrite) || 0));
      let newest = null;
      const agents = [];
      sorted.forEach((r) => (Array.isArray(r.sessions) ? r.sessions : []).forEach((s) => {
        if (!s) return;
        if (!newest || (Number(s.lastSeenAt) || 0) > (Number(newest.lastSeenAt) || 0)) {
          newest = { sessionId: s.sessionId, lastSeenAt: s.lastSeenAt, runId: s.runId || r.runId, agentId: s.agentId };
        }
        const a = String(s.agentId || '');
        if (a && agents.indexOf(a) < 0) agents.push(a);
      }));
      const current = String((newest && newest.runId) || sorted[0].runId);
      const currentRow = sorted.find((r) => r.runId === current) || sorted[0];
      const withDir = currentRow.projectDir ? currentRow : sorted.find((r) => r.projectDir);
      const fam = {
        key: Array.from(g.bases).sort().join('|'),
        projectDir: String((withDir && withDir.projectDir) || ''),
        projectRoot: String((withDir && withDir.projectRoot) || Array.from(g.roots)[0] || ''),
        bases: Array.from(g.bases),
        current: current,
        newestSession: newest,
        agentIds: agents.sort(),
        lastWrite: sorted.reduce((m, r) => Math.max(m, Number(r.lastWrite) || 0), 0),
        turnCount: sorted.reduce((m, r) => m + (Number(r.turnCount) || 0), 0),
        subagentRuns: sorted.filter((r) => isSubRun(r.runId)).length,
        // The label of one run depends on its siblings ("before /clear" needs a clear to
        // exist), so the family is complete before any run is labelled.
        runs: sorted,
      };
      fam.runs = sorted.map((r) => Object.assign({}, r, { label: runLabel(r.runId, fam) }));
      return fam;
    }).sort((a, b) => b.lastWrite - a.lastWrite);
  }

  /** Every run id in `runs` that belongs with `runId`; a family of one when nothing does. */
  function familyIds(runs, runId) {
    const id = String(runId || '');
    const g = familiesOf(runs).find((x) => x.rows.some((r) => String(r.runId) === id));
    return g ? g.rows.map((r) => String(r.runId)) : [id];
  }
  // #endregion identity-model

  // #region lesson-view
  /*
   * The lesson list's arithmetic: order, day groups, counts, placement, attribution and the
   * provenance lines. Depends on the scope predicate and the identity model above, and on
   * nothing in the page.
   */

  function scopeTone(row) {
    if (!scopeKnown(row)) return 'unknown';
    return leaksScope(row) ? 'shared' : 'local';
  }

  /** What the scope means for this entry, in words rather than in a bucket name. */
  const REACH = {
    run: 'Only the run that wrote it. It goes away with that session.',
    session: 'Every run in the same session — so it survives a compaction, but not a new session.',
    global: 'Every run on this instance, in every project. This is the one that follows you.',
    org: 'Everyone on this instance’s organisation. Only promotion writes this scope.',
  };

  function reachSentence(row) {
    const s = scopeOf(row);
    const base = REACH[s] || ('Scope "' + s + '" is not one this page knows about.');
    return scopeKnown(row) ? base : base + ' That is the default, though, not a recorded scope.';
  }

  /** Counted the way the filter keeps them: `run` includes the unrecorded rows, `unknown` counts them again. */
  function scopeCounts(rows) {
    const out = { run: 0, session: 0, global: 0, org: 0, unknown: 0 };
    (rows || []).forEach((r) => {
      const s = scopeOf(r);
      if (Object.prototype.hasOwnProperty.call(out, s)) out[s] += 1;
      if (!scopeKnown(r)) out.unknown += 1;
    });
    return out;
  }

  function typeOf(row) {
    return String((row && (row.lessonType || row.entryType || row.entry_type)) || 'entry');
  }

  function matchesType(row, filter) {
    return !filter || typeOf(row) === filter;
  }

  function typeCounts(rows) {
    const m = new Map();
    (rows || []).forEach((r) => { const k = typeOf(r); m.set(k, (m.get(k) || 0) + 1); });
    return Array.from(m.entries())
      .map((e) => ({ key: e[0], count: e[1] }))
      .sort((a, b) => b.count - a.count || (a.key < b.key ? -1 : a.key > b.key ? 1 : 0));
  }

  /** The row's time as ISO: the feed's `created_at`, else the stamp its own metadata carried. */
  function isoOf(row) {
    return String((row && (row.createdAt || row.created_at || row.timestamp)) || '');
  }

  function timeOf(row) {
    const iso = isoOf(row);
    if (!iso) return 0;
    const t = Date.parse(iso);
    return isNaN(t) ? 0 : t;
  }

  const pad2 = (n) => (n < 10 ? '0' : '') + n;
  const ymd = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());

  /** `Today`, `Yesterday`, a local calendar date, or `Undated` — by the viewer's clock. */
  function dayKey(iso, now) {
    const t = iso ? Date.parse(iso) : NaN;
    if (!iso || isNaN(t)) return 'Undated';
    const key = ymd(new Date(t));
    const n = new Date(typeof now === 'number' ? now : Date.now());
    if (key === ymd(n)) return 'Today';
    n.setDate(n.getDate() - 1);
    if (key === ymd(n)) return 'Yesterday';
    return key;
  }

  /** Newest or oldest first; undated rows last either way, in the order they arrived. */
  function sortRows(rows, order) {
    const dir = order === 'oldest' ? 1 : -1;
    return (rows || []).map((r, i) => ({ r: r, i: i, t: timeOf(r) })).sort((a, b) => {
      if (!a.t && !b.t) return a.i - b.i;
      if (!a.t) return 1;
      if (!b.t) return -1;
      return (a.t - b.t) * dir || a.i - b.i;
    }).map((x) => x.r);
  }

  function groupByDay(rows, now, order) {
    const groups = [];
    const byKey = new Map();
    sortRows(rows, order).forEach((r) => {
      const k = dayKey(isoOf(r), now);
      let g = byKey.get(k);
      if (!g) { g = { key: k, rows: [] }; byKey.set(k, g); groups.push(g); }
      g.rows.push(r);
    });
    return groups;
  }

  /** `HH:MM`, local, 24-hour. */
  function clockOf(iso) {
    const t = iso ? Date.parse(iso) : NaN;
    if (!iso || isNaN(t)) return '—';
    const d = new Date(t);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function localStamp(iso) {
    const t = iso ? Date.parse(iso) : NaN;
    if (!iso || isNaN(t)) return '';
    return ymd(new Date(t)) + ' ' + clockOf(iso);
  }

  function shortId(id, n) {
    return id ? String(id).slice(0, n || 8) : '—';
  }

  /** The run a row was written by, in whichever of the three spellings it arrived. */
  function rowRunId(row) {
    return String((row && (row.sourceRunId || row.run_id || row.runId)) || '');
  }

  /**
   * Where a row stands against the selected directory. `here`: written by one of its runs,
   * under any spelling of their ids. `shared`: written elsewhere at a scope that reaches here
   * at recall. `elsewhere`: everything else. A row that names no run at all is taken as here
   * when a directory is selected — a search result borrows the reader's position — and as
   * whatever its scope says when none is.
   */
  function placement(row, bases) {
    const list = Array.isArray(bases) ? bases : [];
    const run = rowRunId(row);
    if (run && list.indexOf(baseRunId(run)) >= 0) return 'here';
    if (!run && list.length) return 'here';
    return leaksScope(row) ? 'shared' : 'elsewhere';
  }

  function matchesView(row, view, bases) {
    if (view === 'here') return placement(row, bases) === 'here';
    if (view === 'reach') return placement(row, bases) !== 'elsewhere';
    return true;
  }

  /** The three numbers on the view buttons, counted the way the views keep rows. */
  function placementCounts(rows, bases) {
    const out = { here: 0, reach: 0, all: 0 };
    (rows || []).forEach((r) => {
      const p = placement(r, bases);
      out.all += 1;
      if (p !== 'elsewhere') out.reach += 1;
      if (p === 'here') out.here += 1;
    });
    return out;
  }

  /**
   * Who wrote a row, in four words. The server's `origin` wins when it sent one; otherwise
   * the type comes first — the capture hooks stamp `source: 'agent'` on what they ingest, and
   * a trace is a hook capture whatever its source says — then the source. A `mubit_learned`
   * call from a subagent is indistinguishable from the main agent's (one MCP process), so the
   * word is "agent" and no more.
   */
  function originOf(row) {
    const r = row && typeof row === 'object' ? row : {};
    if (r.origin) return String(r.origin);
    const s = String(r.source || '');
    const t = String(r.entryType || r.entry_type || '');
    if (t === 'trace' || t === 'tool_output' || t === 'capture') return 'hook';
    if (r.autoReflection === true || /^auto[-_]?reflect/i.test(s)) return 'auto-reflection';
    if (/^reflect/i.test(s)) return 'reflection';
    if (s === 'agent' || s === 'mcp-agent') return 'agent';
    if (/hook/i.test(s)) return 'hook';
    return '';
  }

  const ORIGIN_WORD = {
    agent: 'agent', 'auto-reflection': 'auto-reflection', reflection: 'reflection', hook: 'hook capture',
  };

  function isReflection(row) {
    const o = originOf(row);
    return o === 'reflection' || o === 'auto-reflection';
  }

  /**
   * An ingest can land a moment after the turn that produced it closed: the write is posted
   * during the turn and the instance stamps it when the job completes. Sixty seconds after
   * `ended_at` still belongs to the turn; the same grace the egress guard allows itself.
   */
  const ATTRIBUTION_GRACE_MS = 60000;

  function windowContains(turn, t) {
    const start = Number(turn && turn.startedAt) || 0;
    if (!start || t < start) return false;
    const end = Number(turn.endedAt) || 0;
    return !end || t <= end + ATTRIBUTION_GRACE_MS;
  }

  /** The turn whose window holds the row's time, in the row's session when it names one. */
  function turnByTime(row, turns) {
    const t = timeOf(row);
    if (!t) return null;
    const sid = String((row && row.sessionId) || '');
    let best = null;
    (Array.isArray(turns) ? turns : []).forEach((turn) => {
      if (!turn) return;
      if (sid && String(turn.sessionId || '') !== sid) return;
      if (!windowContains(turn, t)) return;
      if (!best || (Number(turn.startedAt) || 0) > (Number(best.startedAt) || 0)) best = turn;
    });
    return best;
  }

  /**
   * Which prompt a row belongs to, and how the page knows. `recorded` when the write was
   * stamped with a prompt id — even if the turn file has since been pruned, the fact stands.
   * `by time` when the row's time falls inside a turn's window. Nothing for a reflection,
   * which the instance writes at session end and never for a prompt, and nothing for a time
   * outside every window.
   */
  function attributeTurn(row, turns) {
    const none = { turn: null, how: '' };
    if (!row || typeof row !== 'object') return none;
    if (isReflection(row)) return none;
    const pid = String(row.promptId || '');
    if (pid) {
      const hit = (Array.isArray(turns) ? turns : []).find((x) => x && String(x.promptId || '') === pid) || null;
      return { turn: hit, how: 'recorded' };
    }
    const hit = turnByTime(row, turns);
    return hit ? { turn: hit, how: 'by time' } : none;
  }

  function familyOfRow(row, families) {
    const run = rowRunId(row);
    if (!run) return null;
    const base = baseRunId(run);
    return (Array.isArray(families) ? families : []).find((f) => f && (f.bases || []).indexOf(base) >= 0) || null;
  }

  const PROMPT_WORDS = 60;

  function promptWords(text) {
    const s = String(text || '').replace(/\s+/g, ' ').trim();
    return s.length > PROMPT_WORDS ? s.slice(0, PROMPT_WORDS) + '…' : s;
  }

  /**
   * The provenance block, one line per fact: when and by whom, which directory and run, which
   * session, which prompt, and how far it reaches. Each line says whether the page read the
   * fact or inferred it. A blank row still renders the five lines, each saying "not recorded".
   */
  function provenanceLines(row, ctx) {
    const r = row && typeof row === 'object' ? row : {};
    const c = ctx && typeof ctx === 'object' ? ctx : {};
    const families = Array.isArray(c.families) ? c.families : [];
    const turns = Array.isArray(c.turns) ? c.turns : [];
    const lines = [];

    const iso = isoOf(r);
    const origin = originOf(r);
    let by;
    if (origin === 'agent') by = 'by the agent (mubit_learned)';
    else if (origin === 'auto-reflection') by = 'by auto-reflection (session end)';
    else if (origin === 'reflection') by = 'by reflection';
    else if (origin === 'hook') {
      by = 'hook capture' + (r.tool ? ' (' + r.tool + ')' : '') + (r.hookEvent ? ' · ' + r.hookEvent : '');
    } else by = 'by ' + (r.source ? String(r.source) : 'an unrecorded source');
    if (r.agentType) by += ' · subagent ' + r.agentType;
    lines.push({
      key: 'saved',
      text: 'Saved ' + (iso ? localStamp(iso) : 'at a time this instance did not record') + ' · ' + by,
      iso: iso,
    });

    const run = rowRunId(r);
    const fam = familyOfRow(r, families);
    if (!run) {
      lines.push({ key: 'directory', text: 'Directory not recorded · run unknown' });
    } else if (fam) {
      const member = (fam.runs || []).find((x) => x && String(x.runId) === plainRunId(run));
      lines.push({
        key: 'directory',
        text: 'Directory ' + (fam.projectDir || 'not recorded') + ' · run ' + plainRunId(run)
          + (member && member.label ? ' (' + member.label + ')' : ''),
        family: fam,
      });
    } else {
      lines.push({ key: 'directory', text: 'Directory not in this data directory · run ' + plainRunId(run) });
    }

    const sid = String(r.sessionId || '');
    const byTime = sid ? null : turnByTime(r, turns);
    if (sid) lines.push({ key: 'session', text: 'Session ' + shortSession(sid) + ' · recorded', how: 'recorded', sessionId: sid });
    else if (byTime && byTime.sessionId) {
      lines.push({ key: 'session', text: 'Session ' + shortSession(byTime.sessionId) + ' · by time', how: 'by time', sessionId: String(byTime.sessionId) });
    } else lines.push({ key: 'session', text: 'Session not recorded', how: '' });

    // Another directory's turns are not on this page, so its prompts cannot be named.
    const foreign = !!run && !fam;
    if (!isReflection(r) && !foreign) {
      const attr = attributeTurn(r, turns);
      if (attr.how === 'recorded' && !attr.turn) {
        lines.push({ key: 'prompt', text: 'Prompt recorded · turn file pruned (6 h)', how: 'recorded', turn: null });
      } else if (attr.turn) {
        const n = Number(attr.turn.turnNumber) || Number(r.turnNumber) || 0;
        lines.push({
          key: 'prompt',
          text: 'Prompt “' + promptWords(attr.turn.promptPreview || attr.turn.prompt) + '”'
            + (n ? ' · turn ' + n : '') + ' · ' + attr.how,
          how: attr.how,
          turn: attr.turn,
        });
      } else lines.push({ key: 'prompt', text: 'Prompt not recorded', how: '', turn: null });
    }

    lines.push({ key: 'reach', text: 'Reach: ' + reachSentence(r) });
    return lines;
  }

  /**
   * A failed fetch and an instance holding nothing must not render the same sentence. It is
   * the single most expensive thing this page could get wrong: it tells somebody their memory
   * is empty when their memory is fine and their network is not.
   */
  function listEmptyMessage(ctx) {
    const c = ctx && typeof ctx === 'object' ? ctx : {};
    const lessons = c.mode === 'lessons';
    if (c.error) {
      return {
        kind: 'error',
        text: lessons ? 'Could not load lessons from the instance.' : 'Could not load activity from the instance.',
        detail: String(c.error),
      };
    }
    if (!c.loaded) return { kind: 'loading', text: 'Loading…', detail: '' };
    if (c.total) {
      return { kind: 'filtered', text: 'No entry in the ' + c.total + ' loaded matches this view and these filters.', detail: '' };
    }
    return {
      kind: 'empty',
      text: 'This instance returned no ' + (lessons ? 'lessons' : 'activity') + ' for '
        + (c.view === 'all' ? 'any run anywhere on the instance.' : 'this directory.'),
      detail: '',
    };
  }

  /** The footer's clauses. The census numbers are what make "0 shown" legible. */
  function footerParts(ctx) {
    const c = ctx && typeof ctx === 'object' ? ctx : {};
    const shown = Number(c.shown) || 0;
    const parts = [shown + ' shown'];
    if (c.hidden) parts.push(c.hidden + ' hidden by the scope filter');
    const cen = c.census;
    if (c.mode === 'lessons' && !c.search && cen) {
      parts.push(cen.totalVisible + ' on the instance');
      if (cen.source) parts.push('answered by ' + cen.source);
      if (cen.truncated) {
        parts.push('the census stopped after ' + cen.pages + (cen.pages === 1 ? ' page' : ' pages')
          + (cen.truncatedReason ? ' (' + cen.truncatedReason + ')' : ''));
      }
      if (cen.unknownScope) parts.push(cen.unknownScope + ' with no recorded scope');
    }
    if (c.search) parts.push('search results for “' + String(c.searchQuery || '') + '”');
    return parts;
  }

  /** One sentence per view, saying what the list under it is. */
  function scopeNoteText(ctx) {
    const c = ctx && typeof ctx === 'object' ? ctx : {};
    const lessons = c.mode === 'lessons';
    const what = lessons ? 'Lessons' : 'Entries';
    const these = lessons ? 'lessons' : 'entries';
    let s;
    if (c.view === 'all') s = 'Every ' + (lessons ? 'lesson' : 'entry') + ' on the instance.';
    else if (c.view === 'reach') {
      s = what + ' this directory’s runs saved, plus session and global ' + these
        + ' other directories saved, which reach here at recall.';
    } else s = what + ' this directory’s runs saved.';
    if (c.joinError) s += ' Creation dates are missing: the activity join failed — ' + c.joinError;
    return s;
  }
  // #endregion lesson-view

  // #region turn-view
  /*
   * The turns table and the analytics tiles, as data. Pure; depends on nothing in the page.
   */

  function turnMatches(t, q) {
    if (!q) return true;
    const x = t && typeof t === 'object' ? t : {};
    return ((x.promptPreview || '') + ' ' + (x.outcomeState || '')).toLowerCase().indexOf(q) >= 0;
  }

  /** `0` is not a rung. The ladder is 1–2, and an absent rung is coerced to zero on the way in. */
  function rungText(rung) {
    const n = Number(rung) || 0;
    return n > 0 ? String(n) : '—';
  }

  /**
   * Tri-state, and the third state is not "no". Absent means the signal could not be measured,
   * and rendering it as a count of nothing ("0/0") reads as a measured zero. A bare question
   * mark cannot.
   */
  function usedCell(used) {
    const u = used && typeof used === 'object' ? used : {};
    const ratio = (Number(u.matched) || 0) + '/' + (Number(u.candidates) || 0);
    if (u.used === true) {
      return { text: ratio, tone: 'ok', title: 'The reply carried vocabulary from the injected block that was not already in the prompt.' };
    }
    if (u.used === false) {
      return { text: ratio, tone: 'muted', title: 'No echo found. Weak evidence: the false negatives of this proxy dominate.' };
    }
    return {
      text: '?',
      tone: 'unknown',
      title: 'Not measurable for this turn' + (u.reason ? ' (' + u.reason + ')' : '') + ' — not "unused".',
    };
  }

  function fmtInt(n) {
    const v = Math.round(Number(n) || 0);
    return String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function pct(x) {
    return Math.round((Number(x) || 0) * 100) + '%';
  }

  /** Its own zero-pad: this region evaluates on its own. */
  const two = (n) => (n < 10 ? '0' : '') + n;

  /** `YYYY-MM-DD HH:MM`, local. */
  function stampMs(ms) {
    const t = Number(ms) || 0;
    if (!t) return '—';
    const d = new Date(t);
    return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate())
      + ' ' + two(d.getHours()) + ':' + two(d.getMinutes());
  }

  /** `main`, or `main + N sub (types)`: the agents that ran inside one prompt. */
  function turnAgentsText(t) {
    const x = t && typeof t === 'object' ? t : {};
    const n = Number(x.subagentCount) || 0;
    if (!n) return 'main';
    const types = [];
    (Array.isArray(x.subagentTypes) ? x.subagentTypes : []).forEach((s) => {
      const v = String(s || '');
      if (v && types.indexOf(v) < 0) types.push(v);
    });
    return 'main + ' + n + ' sub' + (types.length ? ' (' + types.join(', ') + ')' : '');
  }

  /** Rows under their session, sessions in the order they were first seen, rows as given. */
  function groupTurnsBySession(rows) {
    const groups = [];
    const byKey = new Map();
    (Array.isArray(rows) ? rows : []).forEach((t) => {
      const k = String((t && t.sessionId) || '');
      let g = byKey.get(k);
      if (!g) { g = { sessionId: k, rows: [] }; byKey.set(k, g); groups.push(g); }
      g.rows.push(t);
    });
    return groups;
  }

  function reflectionRow(l) {
    const o = String((l && l.origin) || '');
    if (o) return o === 'reflection' || o === 'auto-reflection';
    return /^(auto[-_]?)?reflect/i.test(String((l && l.source) || ''));
  }

  /**
   * The lessons saved during one turn: by a stamped prompt id first, then by time inside the
   * turn's window and the turn's session. A reflection is never one of them, and a lesson
   * stamped with another prompt is not either, whatever its time says.
   */
  function lessonsInTurn(turn, lessons) {
    if (!turn || typeof turn !== 'object' || !Array.isArray(lessons)) return [];
    const pid = String(turn.promptId || '');
    const sid = String(turn.sessionId || '');
    const start = Number(turn.startedAt) || 0;
    const end = Number(turn.endedAt) || 0;
    return lessons.filter((l) => {
      if (!l || typeof l !== 'object') return false;
      if (reflectionRow(l)) return false;
      const lp = String(l.promptId || '');
      if (lp) return !!pid && lp === pid;
      if (sid && l.sessionId && String(l.sessionId) !== sid) return false;
      const t = Date.parse(String(l.createdAt || l.created_at || l.timestamp || ''));
      if (isNaN(t) || !start) return false;
      return t >= start && (!end || t <= end + 60000);
    });
  }

  /** One resolved entry as the four things a list line shows: type, when, a preview, its origin. */
  function entrySummary(e) {
    const x = e && typeof e === 'object' ? e : {};
    const content = String(x.content || '');
    const iso = String(x.createdAt || x.created_at || x.timestamp || '');
    const t = iso ? Date.parse(iso) : NaN;
    const d = isNaN(t) ? null : new Date(t);
    return {
      type: String(x.entryType || x.entry_type || x.lessonType || 'entry'),
      tool: String(x.tool || ''),
      preview: content.length > 140 ? content.slice(0, 139) + '…' : content,
      origin: String(x.origin || ''),
      clock: d ? two(d.getHours()) + ':' + two(d.getMinutes()) : '—',
      runId: String(x.runId || x.run_id || x.sourceRunId || ''),
    };
  }

  /** `12s`, `3m 05s`, `1h 02m`; nothing when either end is missing. */
  function durationText(startedAt, endedAt) {
    const a = Number(startedAt) || 0;
    const b = Number(endedAt) || 0;
    if (!a || !b || b < a) return '';
    const s = Math.round((b - a) / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ' + two(s % 60) + 's';
    return Math.floor(m / 60) + 'h ' + two(m % 60) + 'm';
  }

  function tileSpecs(a) {
    const x = a && typeof a === 'object' ? a : {};
    const series = Array.isArray(x.series) ? x.series : [];
    const avg = x.averages || {};
    const n = Number(x.points) || 0;
    const over = 'mean over ' + n + (n === 1 ? ' prompt' : ' prompts');
    const col = (k) => series.map((r) => Number(r && r[k]) || 0);
    return [
      { key: 'Recall cost', value: fmtInt(avg.tok), unit: 'tok / prompt', method: over, series: col('tok') },
      { key: 'Memories injected', value: String(Number(avg.sources) || 0), unit: '/ prompt', method: over, series: col('sources') },
      { key: 'Pointer ratio', value: pct(x.pointerRatio), unit: '', method: 'repeats rendered as a one-line pointer', series: col('ptr') },
      { key: 'Characters', value: fmtInt(avg.chars), unit: '/ prompt', method: over, series: col('chars') },
    ];
  }

  function analyticsNote(a) {
    const x = a && typeof a === 'object' ? a : {};
    const n = Number(x.points) || 0;
    const runs = Array.isArray(x.runIds) ? x.runIds.length : 0;
    return n
      ? 'The series covers ' + n + (n === 1 ? ' prompt' : ' prompts') + ' recorded since '
        + stampMs(x.firstSampleAt) + (runs > 1 ? ' across ' + runs + ' runs of this directory' : '')
        + '. It is the dashboard’s own rollup rather than the raw '
        + 'turn files, which are pruned after six hours — so it accrues from the first launch '
        + 'and cannot reconstruct anything from before that.'
      : 'Nothing recorded yet. The rollup starts empty and grows one row per prompt while this '
        + 'page is open, so the first session here is sparse by construction.';
  }

  function healthTileSpecs(health) {
    const h = health && typeof health === 'object' ? health : {};
    const marker = h.marker || {};
    const captured = marker.captured || {};
    const b = h.breaker || {};
    const rejected = Number(h.rejectedCount) || 0;
    return [
      { key: 'Spool depth', value: fmtInt(h.spoolDepth), unit: 'waiting',
        method: rejected ? rejected + ' rejected' : 'captures waiting to ship', series: [] },
      { key: 'Ingested', value: fmtInt(captured.ingested), unit: '',
        method: fmtInt(captured.pending) + ' pending · ' + fmtInt(captured.tools) + ' tools', series: [] },
      { key: 'Breaker', value: String(b.phase || 'closed'), unit: '',
        method: String(b.state || 'ready') + (Number(b.cooldownLeftMs) > 0
          ? ' · ' + Math.ceil(Number(b.cooldownLeftMs) / 1000) + 's left' : ''), series: [] },
      { key: 'Run state', value: String(marker.state || 'unknown'), unit: '',
        method: (h.runId ? 'run ' + h.runId + ' · ' : '')
          + (marker.mode ? marker.mode + ' · updated ' + stampMs(marker.updated_at) : ''), series: [] },
    ];
  }

  function healthNote(health) {
    const h = health && typeof health === 'object' ? health : {};
    const marker = h.marker || {};
    const reflect = marker.reflect || {};
    const recall = marker.recall || {};
    const n = (v) => Number(v) || 0;
    return (h.runId ? 'These tiles describe run ' + h.runId + ' only. ' : '')
      + 'Last recall on the marker: ' + n(recall.sources) + ' memories, ' + n(recall.tokens)
      + ' tok, rung ' + n(recall.rung)
      + (recall.empty_reason ? ', empty because ' + recall.empty_reason : '')
      + ', dry streak ' + n(recall.dry_streak) + '. '
      + 'Reflection: ' + (reflect.status || 'never run') + ', ' + n(reflect.lessons_stored)
      + ' lessons stored. The marker is last-write-wins, so this row describes the most recent '
      + 'prompt only — the table on the Turns tab is the per-prompt series.';
  }
  // #endregion turn-view

  // -------------------------------------------------------------------------
  // Families and selection
  // -------------------------------------------------------------------------

  function currentFamily() {
    return state.families.find((f) => f.key === state.family.key) || null;
  }

  function currentRunRow() {
    return state.runs.find((r) => r.runId === state.run) || (state.run ? { runId: state.run } : null);
  }
